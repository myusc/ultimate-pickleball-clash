<meta charset="utf-8">
<title>Ultimate Pickleball Clash Characters</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;600&display=swap">
<style>
  :root {
    /* Layout: full-bleed 3D stage; title chip top-left, one control dock floating at the bottom, name tags pinned under each plinth */
    --ink: #0e1830;
    --panel: rgba(14, 24, 48, 0.86);
    --line: rgba(255, 255, 255, 0.12);
    --paper: #f2f5ff;
    --muted: #a8b4d6;
    --ball: #dcf54a;
    --team-a: #ff8a2b;
    --team-b: #b45cff;
    --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --font-body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  [hidden] { display: none !important; }

  #stage { position: fixed; inset: 0; touch-action: none; }
  #c { display: block; width: 100%; height: 100%; cursor: grab; }
  #c.dragging { cursor: grabbing; }

  .title {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: max(16px, env(safe-area-inset-left, 0px));
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 14px 11px;
    pointer-events: none;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .title .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .title h1 {
    margin: 2px 0 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 26px;
    line-height: 1;
    letter-spacing: 0.02em;
  }
  .title h1 span { color: var(--ball); }

  .tag {
    position: fixed;
    left: 0; top: 0;
    transform: translate(-50%, 0);
    pointer-events: none;
    text-align: center;
    white-space: nowrap;
    transition: opacity 0.25s;
  }
  .tag b {
    display: inline-block;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 18px;
    letter-spacing: 0.06em;
    padding: 3px 10px 2px;
    border-radius: 8px;
    color: var(--ink);
  }
  .tag.a b { background: var(--team-a); }
  .tag.b b { background: var(--team-b); color: var(--paper); }
  .tag small {
    display: block;
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--ink);
    font-weight: 500;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
  }

  .dock {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: center;
    gap: 12px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 10px 12px 12px;
    width: max-content;
    max-width: calc(100vw - 32px);
    box-sizing: border-box;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .group { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .group > span {
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    padding-left: 2px;
  }
  .seg {
    display: flex;
    gap: 3px;
    padding: 3px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
  }
  .seg button, .toggle {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: 500 14px var(--font-body);
    padding: 7px 11px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .seg button:hover, .toggle:hover { color: var(--paper); }
  .seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
  .toggle {
    background: rgba(255, 255, 255, 0.07);
    padding: 10px 12px;
    border-radius: 10px;
  }
  .toggle[aria-pressed="true"] { color: var(--ink); background: var(--ball); }
  button:focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; }

  .cycler {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 3px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
  }
  .cycler button {
    border: 0;
    background: transparent;
    color: var(--paper);
    font: 600 20px/1 var(--font-body);
    width: 34px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
  }
  .cycler button:hover { background: rgba(255, 255, 255, 0.1); }
  .cycler output {
    min-width: 140px;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
  }

  .tag.r b { background: #e6ecff; color: var(--ink); font-size: 13px; letter-spacing: 0.03em; }
  .tag.r small { color: var(--paper); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); }
  .tag.r.sel b { background: var(--ball); box-shadow: 0 0 0 2px var(--ink), 0 0 14px rgba(220, 245, 74, 0.8); }
  .cycler output.wide { min-width: 170px; }
  /* Roster tags: number plus that player's ultimate in its colour. */
  .tag.r small .u {
    display: inline-block; margin-left: 4px; padding: 1px 6px; border-radius: 6px;
    background: rgba(14, 24, 48, 0.82); color: var(--ult); text-shadow: none; font-weight: 600;
  }
  /* Selected player's ultimate: name, type and what it does. */
  .ultcard {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 86px);
    left: max(16px, env(safe-area-inset-left, 0px));
    width: min(280px, calc(100vw - 32px));
    box-sizing: border-box;
    padding: 10px 14px 12px;
    border-radius: 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--ult, var(--ball));
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: none;
  }
  .ultcard .who { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .ultcard h2 { margin: 3px 0 2px; font: 400 22px var(--font-display); letter-spacing: 0.03em; color: var(--ult); }
  .ultcard .kind { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: rgba(255, 255, 255, 0.1); color: var(--paper); }
  .ultcard p { margin: 6px 0 0; font-size: 13px; line-height: 1.4; color: var(--muted); }
  /* Phones: a one-line pill so it doesn't cover the back row. */
  @media (max-width: 640px) {
    .ultcard { top: calc(env(safe-area-inset-top, 0px) + 72px); width: auto; padding: 5px 10px; display: flex; align-items: baseline; gap: 8px; }
    .ultcard .who, .ultcard p { display: none; }
    .ultcard h2 { margin: 0; font-size: 16px; }
  }
  .hint {
    position: fixed;
    right: max(16px, env(safe-area-inset-right, 0px));
    top: calc(env(safe-area-inset-top, 0px) + 18px);
    font-size: 12px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.7);
    padding: 6px 10px;
    border-radius: 8px;
    pointer-events: none;
  }

  @media (max-width: 640px) {
    .dock { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); transform: none; width: auto; max-width: none; gap: 8px; padding: 8px; }
    .group { width: 100%; }
    .seg button { flex: 1; padding: 7px 4px; font-size: 13px; }
    .toggle { width: 100%; padding: 8px; }
    .cycler output, .cycler output.wide { flex: 1; min-width: 0; }
    .tag.r b { font-size: 10px; padding: 2px 5px 1px; }
    .group > span { display: none; }
    .seg, .cycler { min-width: 0; }
    .seg button { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .dock { gap: 6px; }
    .tag.r small { display: none; }
    .title h1 { font-size: 21px; }
    .hint { display: none; }
    .tag b { font-size: 15px; }
    .tag small { display: none; }
  }
</style>

<div id="stage"><canvas id="c" aria-label="3D pickleball characters on turntables"></canvas></div>

<div class="title">
  <div class="eyebrow">The 12 preset players</div>
  <h1>ULTIMATE PICKLEBALL <span>CLASH</span></h1>
</div>
<div class="hint">Drag to spin · click a player to select · 1–7 animation · [ ] hair</div>

<div id="tags"></div>

<div class="ultcard" id="ultCard" aria-live="polite">
  <div class="who" id="ultWho">Connor Garnett · #1</div>
  <h2 id="ultName">Firewall</h2>
  <span class="kind" id="ultKind">Boost</span>
  <p id="ultDesc"></p>
</div>

<div class="dock" role="toolbar" aria-label="Preview controls">
  <div class="group">
    <span id="animLabel">Animation</span>
    <div class="seg" role="group" aria-labelledby="animLabel" id="animSeg">
      <button type="button" id="anim-idle" data-anim="idle" aria-pressed="true">Idle</button>
      <button type="button" id="anim-run" data-anim="run" aria-pressed="false">Run</button>
      <button type="button" id="anim-swing" data-anim="swing" aria-pressed="false">Forehand</button>
      <button type="button" id="anim-backhand" data-anim="backhand" aria-pressed="false">Backhand</button>
      <button type="button" id="anim-overhead" data-anim="overhead" aria-pressed="false">Overhead</button>
      <button type="button" id="anim-cheer" data-anim="cheer" aria-pressed="false">Cheer</button>
      <button type="button" id="anim-slump" data-anim="slump" aria-pressed="false">Slump</button>
    </div>
  </div>
  <div class="group" id="pickGroup">
    <span id="pickLabel">Selected player</span>
    <div class="cycler" role="group" aria-labelledby="pickLabel">
      <button type="button" id="pickPrev" aria-label="Previous player">‹</button>
      <output id="pickName" class="wide" aria-live="polite">Connor Garnett</output>
      <button type="button" id="pickNext" aria-label="Next player">›</button>
    </div>
  </div>
  <div class="group" id="zoomGroup">
    <span id="zoomLabel">View</span>
    <div class="seg" role="group" aria-labelledby="zoomLabel" id="zoomSeg">
      <button type="button" data-zoom="0" aria-pressed="true">All 12</button>
      <button type="button" data-zoom="1" aria-pressed="false">Selected</button>
    </div>
  </div>
  <div class="group">
    <span id="faceLabel">Face</span>
    <div class="seg" role="group" aria-labelledby="faceLabel" id="faceSeg">
      <button type="button" data-face="neutral" aria-pressed="true">Normal</button>
      <button type="button" data-face="happy" aria-pressed="false">Happy</button>
      <button type="button" data-face="sad" aria-pressed="false">Sad</button>
      <button type="button" data-face="dizzy" aria-pressed="false">Dizzy</button>
    </div>
  </div>
  <div class="group">
    <span id="hairLabel">Hair</span>
    <div class="cycler" role="group" aria-labelledby="hairLabel">
      <button type="button" id="hairPrev" aria-label="Previous hairstyle">‹</button>
      <output id="hairName" aria-live="polite">You · Spiky</output>
      <button type="button" id="hairNext" aria-label="Next hairstyle">›</button>
    </div>
  </div>
  <div class="group">
    <span id="spinLabel">Turntable</span>
    <button type="button" class="toggle" id="spinBtn" aria-labelledby="spinLabel" aria-pressed="true">Spinning</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';

  /* =====================================================================
     CHARACTER FACTORY  (the game, index.html, has a copy; keep the two in sync)
     Units are feet. Characters face -Z. The rig:
       root ─ rig (height from leg angles) ─┬─ hip ─ knee        (×2 legs)
                                           └─ upper (lean + twist)
                                                ├─ torso, head ─ hair, painted face
                                                └─ shoulder ─ elbow (×2 arms; right holds the paddle)
     ===================================================================== */
  const TEAM_COLORS = { a: 0xff8a2b, b: 0xb45cff };

  const CHARACTERS = [
    { id: 'you',  name: 'YOU',  team: 'a', role: 'You · orange team',     shirt: TEAM_COLORS.a, shorts: 0x1f2a44, skin: 0xf1c7a3, hair: 'spiky',  hairColor: 0x6b4226, paddle: 0x22c7b8, marker: true },
    { id: 'kai',  name: 'KAI',  team: 'a', role: 'Partner · orange team', shirt: TEAM_COLORS.a, shorts: 0x1f2a44, skin: 0x8d5a3b, hair: 'short',  hairColor: 0x151217, paddle: 0xffd23f },
    { id: 'rex',  name: 'REX',  team: 'b', role: 'Rival · violet team',   shirt: TEAM_COLORS.b, shorts: 0x23193a, skin: 0xc68a5e, hair: 'quiff',  hairColor: 0x2b1d14, paddle: 0xff4f6d },
    { id: 'juno', name: 'JUNO', team: 'b', role: 'Rival · violet team',   shirt: TEAM_COLORS.b, shorts: 0x23193a, skin: 0xffdcc2, hair: 'pony',   hairColor: 0xd9a441, paddle: 0x3fa9ff },
  ];

  // Ultimates, in roster order: player #1 has Firewall, #2 Earthquake, and so on.
  // Same table as the game (index.html); keep the two in sync.
  const ULT_INFO = {
    glass:  { name: 'Firewall',   kind: 'Boost', color: '#ff6a1f', hex: 0xff6a1f, desc: 'A 6.5 ft wall of fire over a random third of the net for 8 s bounces their returns back high; lobs fly over it.' },
    quake:  { name: 'Earthquake', kind: 'Shot',  color: '#d9894a', hex: 0xd9894a, desc: 'Your next hit cracks their court and kicks off at an odd angle.' },
    mirage: { name: 'Mirage',     kind: 'Shot',  color: '#ff5fb0', hex: 0xff5fb0, desc: 'Your next hit splits into three balls; two are fakes.' },
    wind:   { name: 'Reborn',     kind: 'Boost', color: '#7be05a', hex: 0x7be05a, desc: 'Refills your and your partner\'s fatigue; for 10 s you both run 30% faster and never mis-hit.' },
    hole:   { name: 'Black Hole', kind: 'Boost', color: '#a06bff', hex: 0xa06bff, desc: 'Opens a black hole near their baseline that drags both rivals toward it for 1.2 s.' },
    cosmo:  { name: 'Cosmo',      kind: 'Boost', color: '#ffc23d', hex: 0xffc23d, desc: 'A golden ring knocks back both rivals half the time, otherwise just one of them.' },
    curve:  { name: 'Flaky',      kind: 'Shot',  color: '#c45cff', hex: 0xc45cff, desc: 'Your next hit bends hard sideways after the net.' },
    gas:    { name: 'Poison',     kind: 'Boost', color: '#b44dd6', hex: 0xb44dd6, desc: 'Gasses both rivals for 3 s: 55% of their hits go wrong.' },
    comet:  { name: 'One Shot',   kind: 'Shot',  color: '#ff7a1a', hex: 0xff7a1a, desc: 'Your next hit is a blazing 75 ft/s shot; rivals react 0.4 s late.' },
    warp:   { name: 'Time Warp',  kind: 'Boost', color: '#4fd1c5', hex: 0x4fd1c5, desc: 'For 3 s the ball moves at 70% and the rivals at 45%.' },
    frost:  { name: 'Cold Snap',  kind: 'Shot',  color: '#7fe3ff', hex: 0x7fe3ff, desc: 'A low kitchen drop that freezes the nearest rival for 0.5 s.' },
    tide:   { name: 'High Tide',  kind: 'Boost', color: '#2fb4ff', hex: 0x2fb4ff, desc: 'Floods their court for 2 s (75% both rivals, 25% just one): once they move, they cannot stop, only brake to half speed by walking back.' },
  };
  const ULT_ORDER = ['glass', 'quake', 'mirage', 'wind', 'hole', 'cosmo', 'curve', 'gas', 'comet', 'warp', 'frost', 'tide'];

  // Roster: 12 selectable players. Simple stylised looks (not likenesses);
  // hair, colours and paddles are just there to tell them apart.
  // Names, looks and ultimates match the game's roster.
  const ROSTER = [
    ['Connor Garnett',    'Connor',     0x2f80ed, 0x1f2a44, 0xf1c7a3, 'quiff',    0x5a3a22, 0xffd23f],
    ['Jade Kawamoto',     'Jade',       0xe94f8a, 0x23193a, 0xf3d0b0, 'pony',     0x151217, 0x3fa9ff],
    ['Hunter Johnson',    'Hunter',     0x27ae60, 0x1f2a44, 0xf5cfae, 'short',    0x8a5a2b, 0xff4f6d],
    ['J-Dub Johnson',     'J-Dub',      0xf2994a, 0x1f2a44, 0xe9b98f, 'buzz',     0x3a2a1e, 0x22c7b8],
    ['Jorja Johnson',     'Jorja',      0x9b51e0, 0x23193a, 0xf5d3b5, 'bun',      0x3b2416, 0xff8a2b],
    ['Gabriel Tardio',    'Gabriel',    0xeb5757, 0x1f2a44, 0xd9a47a, 'spiky',    0x1d1410, 0xdcf54a],
    ['Anna Bright',       'Anna B.',    0x00b8a9, 0x23193a, 0xffdcc2, 'pigtails', 0x141414, 0xb45cff],
    ['Eric Oncins',       'Eric',       0x56ccf2, 0x1f2a44, 0xe2ad84, 'mohawk',   0x3b2416, 0xff4f6d],
    ['Dylan Frazier',     'Dylan',      0x6fcf97, 0x1f2a44, 0xf1c7a3, 'curly',    0x6b4226, 0x2f80ed],
    ['Kaitlyn Christian', 'Kaitlyn',    0xf2c94c, 0x23193a, 0xf3cba8, 'pony',     0x8a5a2b, 0xe94f8a],
    ['Anna Leigh W.',     'Anna Leigh', 0xff6f91, 0x23193a, 0xffdcc2, 'pony',     0xe8c27a, 0x27ae60],
    ['Ben J.',            'Ben',        0x3f51b5, 0x1f2a44, 0xf1c7a3, 'short',    0x4a3020, 0xf2994a],
  ].map(([name, short, shirt, shorts, skin, hair, hairColor, paddle], i) => ({
    id: 'r' + i, name, full: name, short, roster: i, team: i % 2 ? 'b' : 'a', role: `#${i + 1}`,
    shirt, shorts, skin, hair, hairColor, paddle, ult: ULT_ORDER[i],
  }));

  // Leg and arm segment lengths (ft). HIP = THIGH + SHIN + ankle-to-floor.
  const THIGH = 1.05, SHIN = 1.27, ANKLE = 0.13, HIP = THIGH + SHIN + ANKLE;
  const UPPER_ARM = 0.74, FOREARM = 0.7;
  const HEAD_Y = 2.75, HEAD_R = 0.62;
  // Toon shading: three flat light bands instead of smooth shading. It reads
  // as a cartoon and is cheaper to draw than the realistic material.
  const TOON_RAMP = (() => {
    const t = new THREE.DataTexture(new Uint8Array([105, 185, 255]), 3, 1, THREE.LuminanceFormat);
    t.minFilter = t.magFilter = THREE.NearestFilter;
    t.generateMipmaps = false;
    t.needsUpdate = true;
    return t;
  })();
  const mat = (color) => new THREE.MeshToonMaterial({ color, gradientMap: TOON_RAMP });

  /* ---------- painted faces ----------
     Eyes, brows, mouth and blush are painted on one patch of sphere just
     outside the head, so a face is one cheap part and can change expression.
     FACE is the patch: around the head (phi) and down from the crown (theta). */
  const FACE = { w: 1.7, h: 1.3, th0: 0.95, px: 256, py: 196 };
  FACE.phi0 = Math.PI * 1.5 - FACE.w / 2;
  // Head-local point on the front of the head (x right, y up) -> canvas pixel.
  function facePx(x, y) {
    const z = -Math.sqrt(Math.max(0, HEAD_R * HEAD_R - x * x - y * y));
    let phi = Math.atan2(z, -x);
    if (phi < 0) phi += Math.PI * 2;
    return [(phi - FACE.phi0) / FACE.w * FACE.px, (Math.acos(y / HEAD_R) - FACE.th0) / FACE.h * FACE.py];
  }
  const FACES = ['neutral', 'happy', 'sad', 'dizzy'];
  function paintFace(kind, brow) {
    const c = document.createElement('canvas');
    c.width = FACE.px; c.height = FACE.py;
    const g = c.getContext('2d');
    g.lineCap = 'round';
    for (const s of [-1, 1]) {   // s = +1 is the character's right, on the viewer's left
      const [ex, ey] = facePx(s * 0.22, 0.06);
      const [bx, by] = facePx(s * 0.24, 0.27);
      const [cx, cy] = facePx(s * 0.37, -0.1);
      // blush
      g.fillStyle = kind === 'happy' ? 'rgba(255, 105, 120, 0.55)' : 'rgba(255, 120, 130, 0.32)';
      g.beginPath(); g.ellipse(cx, cy, 15, 8, 0, 0, Math.PI * 2); g.fill();
      // eyes
      g.fillStyle = g.strokeStyle = '#17161f';
      if (kind === 'happy') {
        g.lineWidth = 6; g.beginPath(); g.arc(ex, ey + 6, 12, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
      } else if (kind === 'dizzy') {
        g.lineWidth = 3.5; g.beginPath();
        for (let a = 0; a < Math.PI * 5; a += 0.2) { const r = 1 + a * 1.1; g.lineTo(ex + Math.cos(a * s) * r, ey + Math.sin(a * s) * r); }
        g.stroke();
      } else {
        const ry = kind === 'sad' ? 16 : 19;
        g.beginPath(); g.ellipse(ex, ey, 13, ry, 0, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#ffffff';
        g.beginPath(); g.arc(ex - 4, ey - 7, 5, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.arc(ex + 4, ey + 6, 2.2, 0, Math.PI * 2); g.fill();
      }
      // brows: inner end (toward the nose) raised when sad, lowered when dizzy
      const tilt = kind === 'sad' ? -7 : kind === 'dizzy' ? 5 : kind === 'happy' ? -3 : 0;
      const toMid = bx < FACE.px / 2 ? 14 : -14;
      g.strokeStyle = brow; g.lineWidth = 6;
      g.beginPath(); g.moveTo(bx - toMid, by); g.lineTo(bx + toMid, by + tilt); g.stroke();
    }
    const [mx, my] = facePx(0, -0.21);
    g.strokeStyle = '#5a1e24'; g.fillStyle = '#5a1e24'; g.lineWidth = 5;
    g.beginPath();
    if (kind === 'happy') {
      g.moveTo(mx - 20, my - 4); g.quadraticCurveTo(mx, my + 30, mx + 20, my - 4); g.closePath(); g.fill();
      g.fillStyle = '#ff7b8a'; g.beginPath(); g.ellipse(mx, my + 8, 8, 4, 0, 0, Math.PI * 2); g.fill();
    } else if (kind === 'sad') {
      g.moveTo(mx - 15, my + 7); g.quadraticCurveTo(mx, my - 8, mx + 15, my + 7); g.stroke();
    } else if (kind === 'dizzy') {
      g.moveTo(mx - 16, my); for (let i = 1; i <= 4; i++) g.lineTo(mx - 16 + i * 8, my + (i % 2 ? -5 : 5)); g.stroke();
    } else {
      g.moveTo(mx - 15, my - 3); g.quadraticCurveTo(mx, my + 13, mx + 15, my - 3); g.stroke();
    }
    const t = new THREE.CanvasTexture(c);
    t.anisotropy = 4;
    return t;
  }

  const TORSO_PROFILE = [
    [0.0, 0.2], [0.57, 0.22], [0.62, 0.5], [0.62, 0.95], [0.69, 1.35], [0.72, 1.62],
    [0.69, 1.84], [0.57, 2.0], [0.38, 2.11], [0.18, 2.16], [0.0, 2.17],
  ];
  // Smooth a [radius, height] profile with a spline and spin it into a
  // solid. from/to keep just one height band (for the chest stripe); grow
  // pushes that band slightly outside the shirt so it never z-fights.
  function latheProfile(profile, opts = {}) {
    const curve = new THREE.SplineCurve(profile.map(([r, y]) => new THREE.Vector2(r, y)));
    let pts = curve.getPoints(48).map((v) => new THREE.Vector2(Math.max(0, v.x), v.y));
    if (opts.from !== undefined) pts = pts.filter((v) => v.y >= opts.from && v.y <= opts.to);
    if (opts.grow) pts = pts.map((v) => new THREE.Vector2(v.x * opts.grow, v.y));
    return new THREE.LatheGeometry(pts, 32);
  }

  // Extrude a side-profile shape across the foot and turn it so the profile's
  // +u points toward the toes (-Z) and the width runs along X.
  function sneakerPart(draw, width, bevel) {
    const s = new THREE.Shape();
    draw(s);
    const g = new THREE.ExtrudeGeometry(s, {
      depth: width, curveSegments: 8,
      bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3,
    });
    g.translate(0, 0, -width / 2);
    g.rotateY(Math.PI / 2);
    return g;
  }

  // Shared geometry, so four characters cost little more than one.
  const GEO = {
    thigh: new THREE.CylinderGeometry(0.23, 0.2, THIGH, 12),
    shin: new THREE.CylinderGeometry(0.2, 0.17, SHIN - 0.15, 12),
    knee: new THREE.SphereGeometry(0.2, 12, 10),
    sock: new THREE.CylinderGeometry(0.185, 0.18, 0.28, 12),
    // Sneaker: a side-profile outline (u = toe direction, v = up) extruded
    // across the foot with bevelled edges, so it is rounded on every side.
    shoeUpper: sneakerPart((s) => {
      s.moveTo(-0.27, 0);
      s.lineTo(0.3, 0);
      s.quadraticCurveTo(0.44, 0, 0.44, 0.1);    // rounded toe
      s.quadraticCurveTo(0.43, 0.2, 0.25, 0.22); // toe box slopes up
      s.lineTo(0.06, 0.3);                       // laces up to the ankle
      s.lineTo(-0.19, 0.32);                     // collar
      s.quadraticCurveTo(-0.31, 0.3, -0.31, 0.15); // curved heel
      s.quadraticCurveTo(-0.31, 0, -0.27, 0);
    }, 0.28, 0.045),
    shoeSole: sneakerPart((s) => {
      s.moveTo(-0.27, 0);
      s.lineTo(0.39, 0);
      s.quadraticCurveTo(0.46, 0, 0.46, 0.04);
      s.quadraticCurveTo(0.46, 0.08, 0.39, 0.08);
      s.lineTo(-0.27, 0.08);
      s.quadraticCurveTo(-0.34, 0.08, -0.34, 0.04);
      s.quadraticCurveTo(-0.34, 0, -0.27, 0);
    }, 0.31, 0.03),
    // Torso and shorts are lathed from smooth side profiles (radius, height
    // in upper-body space): waist taper, fuller chest, shoulders that round
    // over into the neck. See latheProfile() below.
    shorts: latheProfile([[0.0, -0.27], [0.3, -0.26], [0.55, -0.23], [0.64, -0.1], [0.66, 0.15], [0.64, 0.42], [0.6, 0.56]]),
    torso: latheProfile(TORSO_PROFILE),
    stripe: latheProfile(TORSO_PROFILE, { from: 1.3, to: 1.46, grow: 1.025 }),
    collar: new THREE.TorusGeometry(0.24, 0.05, 8, 24),
    sleeve: new THREE.CylinderGeometry(0.195, 0.175, 0.38, 14),
    neck: new THREE.CylinderGeometry(0.2, 0.22, 0.32, 10),
    head: new THREE.SphereGeometry(HEAD_R, 24, 18),
    facePaint: new THREE.SphereGeometry(HEAD_R + 0.008, 20, 14, FACE.phi0, FACE.w, FACE.th0, FACE.h),
    hairCap: new THREE.SphereGeometry(HEAD_R + 0.05, 24, 12, 0, Math.PI * 2, 0, Math.PI * 0.56),
    blob: new THREE.SphereGeometry(0.3, 12, 10),
    shoulder: new THREE.SphereGeometry(0.21, 16, 12),
    upperArm: new THREE.CylinderGeometry(0.17, 0.15, UPPER_ARM, 10),
    elbow: new THREE.SphereGeometry(0.15, 10, 8),
    forearm: new THREE.CylinderGeometry(0.15, 0.13, FOREARM, 10),
    hand: new THREE.SphereGeometry(0.17, 10, 8),
    grip: new THREE.CylinderGeometry(0.075, 0.07, 0.52, 8),
    face: (() => {
      const w = 0.8, h = 0.96, r = 0.2, s = new THREE.Shape();
      s.moveTo(-w / 2 + r, -h / 2);
      s.lineTo(w / 2 - r, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
      s.lineTo(w / 2, h / 2 - r);  s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
      s.lineTo(-w / 2 + r, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
      s.lineTo(-w / 2, -h / 2 + r); s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
      const g = new THREE.ExtrudeGeometry(s, { depth: 0.07, bevelEnabled: false, curveSegments: 6 });
      g.translate(0, 0, -0.035);
      return g;
    })(),
    marker: new THREE.ConeGeometry(0.34, 0.75, 4),
    buzz: new THREE.SphereGeometry(HEAD_R + 0.035, 24, 9, 0, Math.PI * 2, 0, Math.PI * 0.5),
    spike: new THREE.ConeGeometry(0.13, 0.42, 8),
  };

  /* ---------- hairstyles ----------
     Each builder adds meshes to the head's hair group. Head-local space:
     head centre at the origin, radius HEAD_R, face toward -Z. */
  const UP = new THREE.Vector3(0, 1, 0);
  function part(g, geo, m, pos, scale, rot) {
    const o = new THREE.Mesh(geo, m);
    o.position.set(pos[0], pos[1], pos[2]);
    if (scale) o.scale.set(scale[0], scale[1], scale[2]);
    if (rot) o.rotation.set(rot[0], rot[1], rot[2]);
    g.add(o);
    return o;
  }
  // A direction on the head: tilt = angle down from the crown, turn = angle
  // around the head (0 = back of head, PI = face).
  const onHead = (tilt, turn) => new THREE.Vector3(Math.sin(tilt) * Math.sin(turn), Math.cos(tilt), Math.sin(tilt) * Math.cos(turn));
  const cap = (g, m, s = 1) => part(g, GEO.hairCap, m, [0, 0.02, 0.04], [s, s, s], [0.42, 0, 0]);

  const HAIR = {
    short:  { label: 'Short', build: (g, m) => cap(g, m, 1.05) },
    buzz:   { label: 'Buzz cut', build: (g, m) => part(g, GEO.buzz, m, [0, 0, 0.02], null, [0.5, 0, 0]) },
    quiff:  { label: 'Quiff', build: (g, m) => {
      cap(g, m);
      part(g, GEO.blob, m, [0, 0.5, -0.4], [1.35, 0.5, 0.85], [-0.45, 0, 0]);
    } },
    spiky:  { label: 'Spiky', build: (g, m) => {
      cap(g, m);
      const spots = [[0, 0], [0.5, 0], [0.5, 1.26], [0.5, 2.51], [0.5, 3.77], [0.5, 5.03], [0.95, 0.6], [0.95, 5.68], [0.95, 0]];
      for (const [tilt, turn] of spots) {
        const dir = onHead(tilt, turn);
        const s = part(g, GEO.spike, m, dir.clone().multiplyScalar(HEAD_R + 0.14).toArray());
        s.quaternion.setFromUnitVectors(UP, dir);
      }
    } },
    mohawk: { label: 'Mohawk', build: (g, m) => {
      for (let i = 0; i < 6; i++) {
        const a = -0.75 + i * 0.32; // front (-) to back (+)
        part(g, GEO.blob, m, [0, Math.cos(a) * (HEAD_R + 0.1), Math.sin(a) * (HEAD_R + 0.1)], [0.32, 0.8, 0.55], [a, 0, 0]);
      }
    } },
    curly:  { label: 'Curly', build: (g, m) => {
      cap(g, m, 0.98);
      for (const tilt of [0.2, 0.62, 1.05]) {
        const n = tilt < 0.3 ? 3 : tilt < 0.8 ? 7 : 8;
        for (let i = 0; i < n; i++) {
          const turn = (i / n) * Math.PI * 2 + tilt;
          const dir = onHead(tilt, turn);
          if (tilt > 0.8 && dir.z < -0.15) continue; // keep the face clear
          part(g, GEO.blob, m, dir.multiplyScalar(HEAD_R + 0.04).toArray(), [0.62, 0.62, 0.62]);
        }
      }
    } },
    afro:   { label: 'Afro', build: (g, m) => part(g, GEO.blob, m, [0, 0.38, 0.26], [2.9, 2.55, 2.7]) },
    bun:    { label: 'Top bun', build: (g, m) => {
      cap(g, m);
      part(g, GEO.blob, m, [0, 0.66, 0.22], [0.85, 0.8, 0.85]);
    } },
    pony:   { label: 'Ponytail', build: (g, m) => {
      cap(g, m);
      part(g, GEO.blob, m, [0, 0.12, 0.66], [0.9, 0.9, 0.9]);
      part(g, GEO.blob, m, [0, -0.25, 0.78], [0.7, 1.3, 0.7]);
    } },
    pigtails: { label: 'Pigtails', build: (g, m) => {
      cap(g, m);
      part(g, GEO.blob, m, [-0.68, -0.12, 0.16], [0.55, 1.15, 0.55], [0, 0, -0.3]);
      part(g, GEO.blob, m, [0.68, -0.12, 0.16], [0.55, 1.15, 0.55], [0, 0, 0.3]);
    } },
  };
  const HAIR_STYLES = Object.keys(HAIR);

  function createCharacter(def) {
    const M = {
      skin: mat(def.skin, 0.8), shirt: mat(def.shirt, 0.7), shorts: mat(def.shorts, 0.85),
      shoe: mat(TEAM_COLORS[def.team], 0.55), sole: mat(0xf2f4f8, 0.8), sock: mat(0xffffff, 0.9),
      hair: new THREE.MeshToonMaterial({ color: def.hairColor, gradientMap: TOON_RAMP, side: THREE.DoubleSide }),
      paddle: mat(def.paddle, 0.45), grip: mat(0x23232b, 0.95),
      stripe: mat(0xffffff, 0.7),
    };
    const mesh = (geo, m, x = 0, y = 0, z = 0) => {
      const o = new THREE.Mesh(geo, m);
      o.position.set(x, y, z);
      o.castShadow = true;
      return o;
    };
    const joint = (parent, x, y, z) => {
      const g = new THREE.Group();
      g.position.set(x, y, z);
      parent.add(g);
      return g;
    };

    const root = new THREE.Group();
    const rig = new THREE.Group();
    root.add(rig);

    // Legs: hip joint -> thigh -> knee joint -> shin + foot.
    const makeLeg = (x) => {
      const hip = joint(rig, x, HIP, 0);
      hip.add(mesh(GEO.thigh, M.skin, 0, -THIGH / 2, 0));
      const knee = joint(hip, 0, -THIGH, 0);
      knee.add(mesh(GEO.knee, M.skin));
      knee.add(mesh(GEO.shin, M.skin, 0, -(SHIN - 0.15) / 2, 0));
      knee.add(mesh(GEO.sock, M.sock, 0, -SHIN + 0.2, 0));
      // Shoe origin sits on the floor under the ankle; sole first, upper on it.
      const shoe = joint(knee, 0, -SHIN - ANKLE, -0.06);
      shoe.scale.setScalar(1.12);   // slightly big shoes read better on a small screen
      shoe.add(mesh(GEO.shoeSole, M.sole, 0, 0.03, 0));
      shoe.add(mesh(GEO.shoeUpper, M.shoe, 0, 0.075, 0));
      return { hip, knee };
    };
    const legL = makeLeg(-0.3);
    const legR = makeLeg(0.3);

    // Upper body pivots at the hip for lean and shoulder twist.
    const upper = joint(rig, 0, HIP, 0);
    // Slightly flattened front-to-back so the body reads as a chest, not a can.
    const DEPTH = 0.8;
    const shorts = mesh(GEO.shorts, M.shorts);
    shorts.scale.z = 0.86;
    upper.add(shorts);
    const torso = mesh(GEO.torso, M.shirt);
    torso.scale.z = DEPTH;
    upper.add(torso);
    const stripe = mesh(GEO.stripe, M.stripe);
    stripe.scale.z = DEPTH;
    upper.add(stripe);
    upper.add(mesh(GEO.neck, M.skin, 0, 2.2, 0));
    const collar = mesh(GEO.collar, M.stripe, 0, 2.1, 0);
    collar.rotation.x = Math.PI / 2;
    collar.scale.set(1.15, 1.0, 1);
    upper.add(collar);

    // Head: skin sphere a little oversized (cartoon proportions) with a
    // painted face. setFace() swaps the expression; each one is painted the
    // first time it is needed.
    const head = joint(upper, 0, HEAD_Y, 0);
    head.scale.setScalar(1.12);
    head.add(mesh(GEO.head, M.skin));
    const brow = '#' + new THREE.Color(def.hairColor).multiplyScalar(0.8).getHexString();
    const faces = {};
    const faceMat = new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false });
    const face = new THREE.Mesh(GEO.facePaint, faceMat);
    face.userData.faces = faces;   // so the textures can be freed with the body
    head.add(face);
    function setFace(kind) {
      if (!FACES.includes(kind)) kind = 'neutral';
      faceMat.map = faces[kind] || (faces[kind] = paintFace(kind, brow));
      faceMat.needsUpdate = true;
    }
    setFace('neutral');

    // Hair lives in its own group so the style can be swapped at runtime.
    const hair = joint(head, 0, 0, 0);
    function setHair(style) {
      while (hair.children.length) hair.remove(hair.children[0]);
      (HAIR[style] || HAIR.short).build(hair, M.hair);
      hair.traverse((o) => { if (o.isMesh) o.castShadow = true; });
      def.hair = HAIR[style] ? style : 'short';
    }
    setHair(def.hair);

    // Arms: shoulder (rotation order YXZ: yaw applied last) -> upper arm ->
    // elbow (bends on X) -> forearm -> hand. The paddle rides the right hand.
    const makeArm = (x) => {
      const shoulder = joint(upper, x, 1.86, 0);
      shoulder.rotation.order = 'YXZ';
      shoulder.add(mesh(GEO.shoulder, M.shirt));
      shoulder.add(mesh(GEO.sleeve, M.shirt, 0, -0.2, 0));
      shoulder.add(mesh(GEO.upperArm, M.skin, 0, -UPPER_ARM / 2, 0));
      const elbow = joint(shoulder, 0, -UPPER_ARM, 0);
      elbow.add(mesh(GEO.elbow, M.skin));
      elbow.add(mesh(GEO.forearm, M.skin, 0, -FOREARM / 2, 0));
      const hand = mesh(GEO.hand, M.skin, 0, -FOREARM - 0.05, 0);
      hand.scale.setScalar(1.25);   // chunky cartoon hands
      elbow.add(hand);
      return { shoulder, elbow };
    };
    const armL = makeArm(-0.86);
    const armR = makeArm(0.86);

    const paddle = joint(armR.elbow, 0, -FOREARM - 0.08, 0);
    paddle.add(mesh(GEO.grip, M.grip, 0, -0.2, 0));
    paddle.add(mesh(GEO.face, M.paddle, 0, -0.9, 0));

    let marker = null;
    if (def.marker) {
      marker = new THREE.Mesh(GEO.marker, new THREE.MeshStandardMaterial({
        color: TEAM_COLORS.a, emissive: TEAM_COLORS.a, emissiveIntensity: 0.45, roughness: 0.5,
      }));
      marker.rotation.x = Math.PI;
      marker.position.y = 6.75;
      root.add(marker);
    }

    /* Pose channels (radians). Positive hip = thigh forward, negative knee =
       shin folds back. Positive elbow = forearm folds forward. Arms: x lifts
       forward, y swings across the body (forehand = negative to positive),
       z lifts out to the side. Channels blend toward a target each frame. */
    const cur = {
      lean: -0.18, twist: 0, bounce: 0,
      hipL: 0.35, kneeL: -0.6, hipR: 0.35, kneeR: -0.6,
      lx: 0.3, ly: 0, lz: -0.3, elL: 1.1,
      rx: 0.3, ry: -0.3, rz: 0.3, elR: 1.0,
      roll: 0, // paddle roll about the arm: PI/2 turns the face to lead the swing
      nod: 0,  // extra head tilt: negative looks down (a slump)
    };

    // Overhead smash, 1.6 s loop, as keyframes (p = 0..1 through the loop).
    // Load into the trophy pose (side-on, free hand pointing up, paddle
    // dropped behind the head), drive up and uncoil so the elbow snaps
    // straight at contact high in front, then pull down across the body.
    const READY_POSE = {
      lean: -0.18, twist: 0, bounce: 0,
      hipL: 0.35, kneeL: -0.6, hipR: 0.35, kneeR: -0.6,
      lx: 0.3, ly: 0, lz: -0.3, elL: 1.1,
      rx: 0.3, ry: -0.3, rz: 0.3, elR: 1.0, roll: 0,
    };
    const OVERHEAD = [
      { p: 0, pose: READY_POSE },
      { p: 0.32, pose: { lean: 0.08, twist: -0.6, bounce: 0, hipL: 0.55, kneeL: -1.0, hipR: 0.3, kneeR: -0.8,
        lx: 2.7, ly: 0, lz: -0.15, elL: 0.15, rx: 2.5, ry: 0, rz: 0.35, elR: 2.0, roll: 0 } },
      { p: 0.4, pose: { lean: 0.06, twist: -0.62, bounce: 0, hipL: 0.58, kneeL: -1.05, hipR: 0.32, kneeR: -0.85,
        lx: 2.75, ly: 0, lz: -0.15, elL: 0.15, rx: 2.5, ry: 0, rz: 0.35, elR: 2.05, roll: 0 } },
      { p: 0.47, pose: { lean: -0.05, twist: 0.05, bounce: 0.12, hipL: 0.15, kneeL: -0.2, hipR: 0.1, kneeR: -0.2,
        lx: 1.0, ly: 0.3, lz: -0.3, elL: 1.3, rx: 2.9, ry: 0, rz: 0.2, elR: 0.1, roll: 0 } },
      { p: 0.62, pose: { lean: -0.4, twist: 0.5, bounce: 0, hipL: 0.4, kneeL: -0.6, hipR: 0.2, kneeR: -0.5,
        lx: 0.5, ly: 0.4, lz: -0.4, elL: 1.2, rx: 0.8, ry: 0.6, rz: 0.1, elR: 0.4, roll: 0 } },
      { p: 1, pose: READY_POSE },
    ];
    function keyed(frames, p) {
      let i = 0;
      while (i < frames.length - 2 && p >= frames[i + 1].p) i++;
      const a = frames[i], b = frames[i + 1];
      let k = Math.min(1, Math.max(0, (p - a.p) / (b.p - a.p)));
      k = k * k * (3 - 2 * k); // smoothstep
      const out = {};
      for (const key in a.pose) out[key] = a.pose[key] + (b.pose[key] - a.pose[key]) * k;
      return out;
    }

    function targetPose(mode, t) {
      if (mode === 'overhead') return keyed(OVERHEAD, (t % 1.6) / 1.6);
      if (mode === 'cheer') {
        // Won the point: both arms up and little hops.
        const hop = Math.abs(Math.sin(t * 7));
        return {
          lean: 0.05, twist: Math.sin(t * 3.5) * 0.15, bounce: hop * 0.3,
          hipL: 0.15 - hop * 0.1, kneeL: -0.3 + hop * 0.2, hipR: 0.15 - hop * 0.1, kneeR: -0.3 + hop * 0.2,
          lx: 2.9, ly: 0, lz: -0.35 - hop * 0.15, elL: 0.35,
          rx: 2.9, ry: 0, rz: 0.35 + hop * 0.15, elR: 0.35, roll: 0, nod: 0.15,
        };
      }
      if (mode === 'slump') {
        // Lost the point: shoulders drop, arms hang, head down.
        const b = Math.sin(t * 1.4);
        return {
          lean: -0.45, twist: 0, bounce: 0,
          hipL: 0.3, kneeL: -0.45, hipR: 0.3, kneeR: -0.45,
          lx: 0.15, ly: 0, lz: -0.08, elL: 0.25 + b * 0.05,
          rx: 0.2, ry: 0, rz: 0.08, elR: 0.3 + b * 0.05, roll: 0, nod: -0.45,
        };
      }
      if (mode === 'run') {
        const f = t * 9.5, sL = Math.sin(f), cL = Math.cos(f);
        return {
          lean: -0.3, twist: sL * 0.12, bounce: Math.abs(sL) * 0.12,
          // Knee folds most while the leg swings forward from behind.
          hipL: 0.65 * sL,  kneeL: -0.25 - 1.1 * Math.max(0, cL),
          hipR: -0.65 * sL, kneeR: -0.25 - 1.1 * Math.max(0, -cL),
          lx: 0.1 - 0.75 * sL, ly: 0, lz: -0.2, elL: 1.45,
          rx: 0.25 + 0.55 * sL, ry: -0.35, rz: 0.3, elR: 1.25, roll: 0,
        };
      }
      if (mode === 'backhand') {
        // Flat one-handed backhand, 1.5 s loop. Mirror of the forehand: the
        // shoulders coil left and the paddle goes back past the left hip
        // with a bent elbow (left hand guiding it), then the arm extends and
        // sweeps left-to-right on a level path. Contact is out in front on
        // the left, where the rolled face looks straight at the net.
        const p = (t % 1.5) / 1.5;
        const ease = (k) => 1 - Math.pow(1 - k, 3);
        let ry, twist, elR, knee, lx, ly, lz, elL;
        if (p < 0.3) {            // coil: paddle back to the left hip
          const k = ease(p / 0.3);
          ry = 0.4 + 0.2 * k; twist = 1.1 * k; elR = 0.6 - 0.25 * k; knee = -0.6 - 0.25 * k;
          lx = 0.6 + 0.3 * k; ly = 0.3 * k; lz = -0.25 + 0.15 * k; elL = 1.0 + 0.3 * k;
        } else if (p < 0.42) {    // uncoil: level sweep, elbow straightens
          const k = ease((p - 0.3) / 0.12);
          ry = 0.6 - 0.6 * k; twist = 1.1 - 1.3 * k; elR = 0.35 - 0.25 * Math.min(1, k * 2); knee = -0.85 + 0.3 * k;
          lx = 0.9 - 1.2 * k; ly = 0.3 - 0.3 * k; lz = -0.1 - 0.5 * k; elL = 1.3 - 1.0 * k;
        } else {                  // hold the finish, then back to ready
          const k = ease(Math.min(1, (p - 0.42) / 0.5));
          ry = 0.4 * k; twist = -0.2 * (1 - k); elR = 0.1 + 0.5 * k; knee = -0.55 - 0.05 * k;
          lx = -0.3 + 0.9 * k; ly = 0; lz = -0.6 + 0.35 * k; elL = 0.3 + 0.7 * k;
        }
        return {
          lean: -0.2, twist, bounce: 0,
          // closed stance: right foot steps across toward the ball
          hipL: 0.15, kneeL: knee + 0.2, hipR: 0.5, kneeR: knee - 0.15,
          lx, ly, lz, elL,
          rx: 1.0, ry, rz: 0, elR, roll: Math.PI / 2,
        };
      }
      if (mode === 'swing') {
        // Flat forehand, 1.5 s loop. The arm sweeps around the body on a
        // level, waist-high path (fixed tilt, no side lift), and the paddle is
        // rolled so its face stays upright and leads the swing. Contact is
        // out to the side, where the face looks straight at the net.
        const p = (t % 1.5) / 1.5;
        const ease = (k) => 1 - Math.pow(1 - k, 3);
        const READY = -0.9, BACK = -2.5, THROUGH = 0.5;
        let ry, twist, elR, knee;
        if (p < 0.3) {            // take the paddle straight back
          const k = ease(p / 0.3);
          ry = READY + (BACK - READY) * k; twist = -0.6 * k; elR = 0.5 + 0.1 * k; knee = -0.6 - 0.25 * k;
        } else if (p < 0.42) {    // sweep through level, arm extending
          const k = ease((p - 0.3) / 0.12);
          ry = BACK + (THROUGH - BACK) * k; twist = -0.6 + 1.05 * k; elR = 0.6 - 0.45 * k; knee = -0.85 + 0.3 * k;
        } else {                  // finish across the body, settle to ready
          const k = ease(Math.min(1, (p - 0.42) / 0.5));
          ry = THROUGH + (READY - THROUGH) * k; twist = 0.45 * (1 - k); elR = 0.15 + 0.35 * k; knee = -0.55 - 0.05 * k;
        }
        return {
          lean: -0.2, twist, bounce: 0,
          hipL: 0.5, kneeL: knee - 0.15, hipR: 0.15, kneeR: knee + 0.2,
          lx: 0.9, ly: 0.4, lz: -0.35, elL: 0.6,
          rx: 1.0, ry, rz: 0, elR, roll: Math.PI / 2,
        };
      }
      // idle: athletic ready stance, knees soft, paddle up in front
      const b = Math.sin(t * 2.2);
      return {
        lean: -0.18, twist: Math.sin(t * 0.9) * 0.05, bounce: 0,
        hipL: 0.35 + b * 0.04, kneeL: -0.6 - b * 0.08,
        hipR: 0.35 + b * 0.04, kneeR: -0.6 - b * 0.08,
        lx: 0.3, ly: 0, lz: -0.3, elL: 1.1 + b * 0.05,
        rx: 0.3, ry: -0.3, rz: 0.3, elR: 1.0 + b * 0.05, roll: 0,
      };
    }

    // Height of the hip above the floor for a given thigh/knee angle, so a
    // crouch lowers the body and the feet stay planted.
    const legHeight = (hip, knee) => THIGH * Math.cos(hip) + SHIN * Math.cos(hip + knee) + ANKLE;

    // Small life touches: a quick stretch at the start of each swing, gentle
    // breathing, and a head that turns toward whatever look() points it at.
    let pop = 0, lastMode = '', lastT = 0, breath = 0, lookWant = 0, lookNow = 0;
    const SWINGS = ['swing', 'backhand', 'overhead'];
    function look(yaw) { lookWant = Math.max(-0.9, Math.min(0.9, yaw)); }

    function update(mode, t, dt) {
      const swinging = SWINGS.includes(mode);
      if (swinging && (mode !== lastMode || t < lastT)) pop = 1;   // a new swing starts
      lastMode = mode; lastT = t;
      pop *= Math.exp(-dt * 6);
      breath += dt;
      lookNow += (lookWant - lookNow) * (1 - Math.exp(-dt * 6));

      const tgt = targetPose(mode, t);
      const k = 1 - Math.exp(-dt * (swinging ? 30 : 12));
      for (const key in cur) cur[key] += ((tgt[key] ?? 0) - cur[key]) * k;

      legL.hip.rotation.x = cur.hipL;  legL.knee.rotation.x = cur.kneeL;
      legR.hip.rotation.x = cur.hipR;  legR.knee.rotation.x = cur.kneeR;
      const stand = Math.max(legHeight(cur.hipL, cur.kneeL), legHeight(cur.hipR, cur.kneeR));
      rig.position.y = stand - HIP + cur.bounce;
      rig.scale.set(1 - pop * 0.05, 1 + pop * 0.08, 1 - pop * 0.05);   // squash and stretch

      upper.rotation.x = cur.lean;
      upper.rotation.y = cur.twist;
      head.rotation.x = -cur.lean * 0.7 + cur.nod; // keep eyes level when leaning
      head.rotation.y = lookNow;
      head.position.y = HEAD_Y + Math.sin(breath * 2.4) * 0.02;   // breathing
      armL.shoulder.rotation.set(cur.lx, cur.ly, cur.lz);
      armL.elbow.rotation.x = cur.elL;
      armR.shoulder.rotation.set(cur.rx, cur.ry, cur.rz);
      armR.elbow.rotation.x = cur.elR;
      paddle.rotation.y = cur.roll;

      if (marker) {
        marker.position.y = 6.75 + Math.sin(t * 3) * 0.15;
        marker.rotation.y = t * 1.5;
      }
    }

    return { def, root, update, setHair, setFace, look };
  }

  window.KitchenClash = Object.assign(window.KitchenClash || {}, { createCharacter, CHARACTERS, TEAM_COLORS, HAIR, HAIR_STYLES });

  /* =====================================================================
     PREVIEW STAGE
     ===================================================================== */
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  {
    const c = document.createElement('canvas');
    c.width = 4; c.height = 256;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, '#5aa8f0');
    grad.addColorStop(0.62, '#bfe2ff');
    grad.addColorStop(1, '#e9f5ff');
    g.fillStyle = grad;
    g.fillRect(0, 0, 4, 256);
    scene.background = new THREE.CanvasTexture(c);
  }
  scene.fog = new THREE.Fog(0xcfe9ff, 45, 110);

  scene.add(new THREE.HemisphereLight(0xe6f3ff, 0x40604a, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(7, 16, 11);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 50 });
  sun.shadow.bias = -0.0004;
  scene.add(sun);

  // Floor: a slice of court. Blue surface, lighter kitchen band, white lines.
  const flat = (w, l, color, y) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, l), new THREE.MeshStandardMaterial({ color, roughness: 0.92 }));
    m.rotation.x = -Math.PI / 2;
    m.position.y = y;
    m.receiveShadow = true;
    scene.add(m);
    return m;
  };
  flat(260, 260, 0x1f6b57, -0.01);
  flat(60, 40, 0x2a56c6, 0);
  flat(60, 7, 0x58a6ea, 0.004).position.z = -7.5;
  flat(60, 0.17, 0xffffff, 0.008).position.z = -4;
  flat(60, 0.17, 0xffffff, 0.008).position.z = -11;

  const plinthGeo = new THREE.CylinderGeometry(1.7, 1.8, 0.28, 40);
  const ringGeo = new THREE.TorusGeometry(1.75, 0.05, 6, 48);

  // One turntable per preset player.
  const actors = ROSTER.map((def, i) => {
    const ch = createCharacter(def);
    const base = new THREE.Group();
    const plinth = new THREE.Mesh(plinthGeo, mat(0x16223e, 0.6));
    plinth.position.y = 0.14;
    plinth.receiveShadow = true;
    plinth.castShadow = true;
    const ringColor = 0x8a97b8;
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({
      color: ringColor, emissive: ringColor, emissiveIntensity: 0.35,
    }));
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.29;
    ch.root.position.y = 0.28;
    base.add(plinth, ring, ch.root);
    scene.add(base);

    const tag = document.createElement('div');
    tag.className = 'tag r';
    tag.innerHTML = '<b></b><small></small>';
    tag.querySelector('b').textContent = def.name;
    tag.querySelector('small').textContent = def.role;
    tag.style.setProperty('--ult', ULT_INFO[def.ult].color);
    document.getElementById('tags').appendChild(tag);

    return { ch, base, ring, tag, phase: i * 0.37, spin: Math.PI, target: new THREE.Vector3() };
  });

  /* ---------- layout + camera ---------- */
  const camera = new THREE.PerspectiveCamera(35, 1, 0.5, 300);
  const camPos = new THREE.Vector3(0, 6, 30);
  const camLook = new THREE.Vector3(0, 3, 0);
  const wantPos = new THREE.Vector3();
  const wantLook = new THREE.Vector3();

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },
  };
  const saved = store.get('kc-roster', {});
  const ui = { anim: 'idle', spinning: true, pick: Number.isInteger(saved.pick) ? saved.pick % 12 : 0, zoom: false };
  const roster = actors;
  // The actor the camera focuses on, or null for all 12.
  const focus = () => (ui.zoom ? roster[ui.pick] : null);
  let portrait = false;

  function layout() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    portrait = camera.aspect < 0.9;
    camera.fov = portrait ? 42 : 35;
    camera.updateProjectionMatrix();
    // Roster: two rows of six, or four rows of three on a tall screen.
    roster.forEach((a, i) => {
      if (portrait) a.target.set(((i % 3) - 1) * 4.0, 0, 4 - Math.floor(i / 3) * 5.5);
      else a.target.set(((i % 6) - 2.5) * 4.3, 0, 3 - Math.floor(i / 6) * 9);
    });
  }

  function cameraGoal() {
    const f = focus();
    if (f) {
      const t = f.target;
      wantPos.set(t.x, 4.6, t.z + (portrait ? 19 : 14));
      wantLook.set(t.x, portrait ? 2.6 : 3.2, t.z);
      return;
    }
    const halfW = portrait ? 10.5 : 13.5, tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
    const d = Math.max(portrait ? 24 : 20, halfW / tanH + (portrait ? 6 : 10));
    wantPos.set(0, portrait ? d * 0.95 : 17, portrait ? d * 0.55 : d);
    wantLook.set(0, 0, portrait ? -6 : -2.5);
  }

  window.addEventListener('resize', layout);
  layout();
  actors.forEach((a) => a.base.position.copy(a.target));
  cameraGoal();
  camPos.copy(wantPos);
  camLook.copy(wantLook);

  /* ---------- controls ---------- */
  function press(segId, btn) {
    document.querySelectorAll('#' + segId + ' button').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
  }
  function setAnim(name) {
    ui.anim = name;
    press('animSeg', document.getElementById('anim-' + name));
  }
  document.getElementById('animSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) setAnim(b.dataset.anim);
  });
  // Face: every player shows the chosen expression.
  document.getElementById('faceSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    press('faceSeg', b);
    actors.forEach((a) => a.ch.setFace(b.dataset.face));
  });

  // Hair cycles the selected player's style.
  const hairName = document.getElementById('hairName');
  const hairTarget = () => roster[ui.pick];
  function showHair() {
    const a = hairTarget();
    const name = a.ch.def.full || a.ch.def.name.charAt(0) + a.ch.def.name.slice(1).toLowerCase();
    hairName.textContent = `${name} · ${HAIR[a.ch.def.hair].label}`;
  }
  function stepHair(dir) {
    const a = hairTarget();
    const i = HAIR_STYLES.indexOf(a.ch.def.hair);
    a.ch.setHair(HAIR_STYLES[(i + dir + HAIR_STYLES.length) % HAIR_STYLES.length]);
    showHair();
  }
  document.getElementById('hairPrev').addEventListener('click', () => stepHair(-1));
  document.getElementById('hairNext').addEventListener('click', () => stepHair(1));
  showHair();

  // Selection: which of the 12 is highlighted, and the All 12 / Selected view.
  const pickName = document.getElementById('pickName');
  function syncLineup() {
    press('zoomSeg', document.querySelector(`#zoomSeg [data-zoom="${ui.zoom ? 1 : 0}"]`));
    actors.forEach((a) => {
      const sel = roster[ui.pick] === a;
      // In Selected view only the chosen player stands on stage, so nobody blocks them.
      a.base.visible = !ui.zoom || sel;
      a.tag.classList.toggle('sel', sel);
      const small = a.tag.querySelector('small');
      small.textContent = sel ? 'Selected' : a.ch.def.role;
      const u = document.createElement('span');
      u.className = 'u';
      u.textContent = ULT_INFO[a.ch.def.ult].name;
      small.appendChild(u);
      a.ring.material.color.setHex(sel ? 0xdcf54a : 0x8a97b8);
      a.ring.material.emissive.setHex(sel ? 0xdcf54a : 0x8a97b8);
      a.ring.material.emissiveIntensity = sel ? 0.9 : 0.35;
    });
    const def = roster[ui.pick].ch.def, u = ULT_INFO[def.ult];
    pickName.textContent = def.full;
    const card = document.getElementById('ultCard');
    card.style.setProperty('--ult', u.color);
    document.getElementById('ultWho').textContent = `${def.full} · ${def.role}`;
    document.getElementById('ultName').textContent = u.name;
    document.getElementById('ultKind').textContent = u.kind === 'Shot' ? 'Shot · powers your next hit' : 'Boost · starts at once';
    document.getElementById('ultDesc').textContent = u.desc;
    store.set('kc-roster', { pick: ui.pick });
    showHair();
  }
  function pick(i) {
    ui.pick = (i + 12) % 12;
    syncLineup();
  }
  document.getElementById('zoomSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    ui.zoom = b.dataset.zoom === '1';
    syncLineup();
  });
  document.getElementById('pickPrev').addEventListener('click', () => pick(ui.pick - 1));
  document.getElementById('pickNext').addEventListener('click', () => pick(ui.pick + 1));
  syncLineup();
  const spinBtn = document.getElementById('spinBtn');
  spinBtn.addEventListener('click', () => {
    ui.spinning = !ui.spinning;
    spinBtn.setAttribute('aria-pressed', String(ui.spinning));
    spinBtn.textContent = ui.spinning ? 'Spinning' : 'Stopped';
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === '1') setAnim('idle');
    else if (e.key === '2') setAnim('run');
    else if (e.key === '3') setAnim('swing');
    else if (e.key === '4') setAnim('backhand');
    else if (e.key === '5') setAnim('overhead');
    else if (e.key === '6') setAnim('cheer');
    else if (e.key === '7') setAnim('slump');
    else if (e.key === '[') stepHair(-1);
    else if (e.key === ']') stepHair(1);
  });

  // Drag anywhere on the stage to spin every turntable by hand.
  let drag = null;
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function clickPick(e) {
    ndc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(roster.map((a) => a.base), true)[0];
    if (!hit) return;
    const a = roster.find((r) => { let o = hit.object; while (o) { if (o === r.base) return true; o = o.parent; } return false; });
    if (a) pick(roster.indexOf(a));
  }
  canvas.addEventListener('pointerdown', (e) => {
    drag = { id: e.pointerId, x: e.clientX, x0: e.clientX, y0: e.clientY };
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x;
    drag.x = e.clientX;
    actors.forEach((a) => { a.spin += dx * 0.012; });
  });
  const endDrag = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (e.type === 'pointerup' && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) clickPick(e);
    drag = null;
    canvas.classList.remove('dragging');
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  /* ---------- loop ---------- */
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const tagPoint = new THREE.Vector3();
  let last = performance.now();
  let clock = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    clock += dt;

    const ease = 1 - Math.exp(-dt * 5);
    actors.forEach((a) => {
      a.base.position.lerp(a.target, ease);
      if (ui.spinning && !drag && !reduceMotion) a.spin += dt * 0.55;
      a.ch.root.rotation.y = a.spin;
      a.ch.update(ui.anim, clock + a.phase, dt);
    });

    // On a tall screen, centre the roster in the space above the control dock.
    if (portrait && !ui.zoom) {
      const dockTop = document.querySelector('.dock').getBoundingClientRect().top;
      const titleBottom = document.querySelector('.title').getBoundingClientRect().bottom;
      camera.setViewOffset(window.innerWidth, window.innerHeight, 0, window.innerHeight / 2 - (titleBottom + dockTop) / 2, window.innerWidth, window.innerHeight);
    } else camera.clearViewOffset();
    cameraGoal();
    camPos.lerp(wantPos, 1 - Math.exp(-dt * 4));
    camLook.lerp(wantLook, 1 - Math.exp(-dt * 4));
    camera.position.copy(camPos);
    camera.lookAt(camLook);

    renderer.render(scene, camera);

    // Pin each name tag in front of its plinth, or above the head in the
    // stacked portrait layout so back-row tags never cover the front row.
    const w = window.innerWidth, h = window.innerHeight;
    const f = focus();
    const above = !f && portrait;
    actors.forEach((a) => {
      if (above) tagPoint.set(a.base.position.x, 6.4, a.base.position.z);
      else tagPoint.set(a.base.position.x, 0, a.base.position.z + 1.9);
      tagPoint.project(camera);
      const x = (tagPoint.x * 0.5 + 0.5) * w;
      const y = (-tagPoint.y * 0.5 + 0.5) * h;
      a.tag.style.transform = `translate(${x}px, ${y}px) translate(-50%, ${above ? '-100%' : '0'})`;
      a.tag.style.opacity = !f || f === a ? '1' : '0';
    });
  }
  requestAnimationFrame(frame);
})();
</script>
