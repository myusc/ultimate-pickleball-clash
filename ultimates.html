<meta charset="utf-8">
<title>Ultimate Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;600&display=swap">
<style>
  :root {
    /* Layout: full-bleed 3D practice court; ultimate picker docked left (a top sheet on phones);
       fire button and lab controls docked bottom-right (a bottom bar on phones). One dark look, same as the game. */
    --ink: #0e1830;
    --panel: rgba(14, 24, 48, 0.88);
    --raise: rgba(255, 255, 255, 0.06);
    --line: rgba(255, 255, 255, 0.12);
    --paper: #f2f5ff;
    --muted: #a8b4d6;
    --ball: #dcf54a;
    --team-a: #ff8a2b;
    --team-b: #b45cff;
    --good: #7be05a;
    --bad: #ff6b6b;
    --ult: #ff7a1a;           /* set from the selected ultimate */
    --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --font-body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  #stage { position: fixed; inset: 0; }
  #c { display: block; width: 100%; height: 100%; transition: filter 0.4s; }
  body.warping #c { filter: saturate(0.55) hue-rotate(-18deg) brightness(1.04); }
  .warpfx {
    position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.35s;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(79, 209, 197, 0.38) 100%);
  }
  body.warping .warpfx { opacity: 1; }

  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  /* ---------- picker ---------- */
  .lab {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: max(16px, env(safe-area-inset-left, 0px));
    width: 300px;
    max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
    padding: 14px;
    box-sizing: border-box;
    display: flex; flex-direction: column; gap: 12px;
  }
  .lab header .eyebrow {
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  }
  .lab h1 {
    margin: 2px 0 0; font-family: var(--font-display); font-weight: 400;
    font-size: 30px; line-height: 1; letter-spacing: 0.01em;
  }
  .lab h1 span { color: var(--ult); transition: color 0.3s; }
  .ults { display: flex; flex-direction: column; gap: 6px; }
  .ult {
    display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px;
    padding: 8px 10px; text-align: left;
    background: var(--raise); border: 1px solid transparent; border-radius: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  .ult:hover { background: rgba(255, 255, 255, 0.1); }
  .ult[aria-selected="true"] { border-color: var(--c); background: rgba(255, 255, 255, 0.1); }
  .orb {
    width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff 0 8%, var(--c) 40%, color-mix(in srgb, var(--c) 40%, #000) 100%);
    box-shadow: 0 0 12px color-mix(in srgb, var(--c) 60%, transparent);
  }
  .ult .nm { font-weight: 600; font-size: 14.5px; line-height: 1.15; }
  .ult .nm small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .ult .key {
    font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px;
    min-width: 18px; text-align: center; padding: 1px 4px;
  }
  .detail { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600;
    padding: 3px 8px; border-radius: 999px; background: var(--raise); color: var(--muted);
  }
  .badge.live { background: color-mix(in srgb, var(--team-a) 22%, transparent); color: #ffc28f; }
  .detail p { margin: 0; font-size: 13.5px; line-height: 1.45; color: #dfe5f7; }
  .detail dl {
    margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px;
  }
  .detail dt { color: var(--muted); }
  .detail dd { margin: 0; font-variant-numeric: tabular-nums; }
  .tally {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;
  }
  .tally div { background: var(--raise); border-radius: 10px; padding: 7px 8px; }
  .tally b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
  .tally span { font-size: 11px; color: var(--muted); }
  .tally .w b { color: var(--good); }
  .tally .r b { color: var(--bad); }
  .compare { font-size: 12px; color: var(--muted); margin: 0; }
  .lastshot { font-size: 12px; color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }

  /* ---------- dock ---------- */
  .dock {
    position: fixed;
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px;
  }
  .fire {
    position: relative; flex: none;
    width: 92px; height: 92px; border-radius: 50%; border: 0; padding: 0;
    background: conic-gradient(var(--ult) calc(var(--fill, 1) * 360deg), rgba(255,255,255,0.14) 0);
    display: grid; place-items: center;
    box-shadow: 0 0 22px color-mix(in srgb, var(--ult) 45%, transparent);
    transition: transform 0.1s;
  }
  .fire:active { transform: scale(0.95); }
  .fire .core {
    width: 78px; height: 78px; border-radius: 50%; background: #16213d;
    display: grid; place-content: center; text-align: center; gap: 1px;
  }
  .fire b { font-family: var(--font-display); font-weight: 400; font-size: 21px; letter-spacing: 0.04em; line-height: 1; }
  .fire small { font-size: 10.5px; color: var(--muted); letter-spacing: 0.08em; }
  .fire.armed { animation: pulse 0.7s ease-in-out infinite alternate; }
  .fire.armed .core { background: color-mix(in srgb, var(--ult) 35%, #16213d); }
  @keyframes pulse { to { box-shadow: 0 0 34px var(--ult); } }
  .ctl { display: grid; grid-template-columns: auto auto; gap: 7px 10px; align-items: center; }
  .ctl .lbl { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .seg { display: flex; background: var(--raise); border-radius: 10px; padding: 2px; gap: 2px; }
  .seg button {
    border: 0; background: transparent; border-radius: 8px; padding: 5px 9px; font-size: 12.5px; color: var(--muted);
  }
  .seg button[aria-pressed="true"] { background: rgba(255,255,255,0.16); color: var(--paper); }

  /* ---------- result + tags ---------- */
  .result {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 22px); left: calc(50% + 158px);
    transform: translate(-50%, -8px); opacity: 0; transition: opacity 0.2s, transform 0.2s;
    padding: 10px 18px 11px; text-align: center; pointer-events: none; min-width: 180px;
  }
  .result.show { opacity: 1; transform: translate(-50%, 0); }
  .result b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.05; }
  .result span { font-size: 13px; color: var(--muted); }
  .result.win b { color: var(--good); }
  .result.lose b { color: var(--bad); }
  #tags { position: fixed; inset: 0; pointer-events: none; }
  .tag {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -100%);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em; white-space: nowrap;
  }
  .tag .st {
    padding: 2px 7px; border-radius: 999px; background: rgba(14, 24, 48, 0.85); color: var(--paper);
  }
  .tag .st:empty { display: none; }
  .tag .bar { width: 46px; height: 6px; border-radius: 3px; background: rgba(14, 24, 48, 0.8); overflow: hidden; }
  .tag .bar i { display: block; height: 100%; background: var(--good); border-radius: 3px; }
  .tag .bar.mid i { background: #ffc531; }
  .tag .bar.low i { background: var(--bad); }
  .keys {
    position: fixed; left: max(332px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    font-size: 12px; color: var(--muted); padding: 7px 11px;
  }
  .keys kbd {
    font: inherit; font-size: 11px; color: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px;
  }
  @media (max-width: 1080px) { .keys { display: none; } }

  /* ---------- phones ---------- */
  @media (max-width: 760px) {
    .lab {
      left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      width: auto; padding: 10px 12px; gap: 8px; max-height: 42%;
    }
    .lab header .eyebrow { display: none; }
    .lab h1 { font-size: 22px; }
    .ults { flex-direction: row; overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 0 12px; }
    .ults::-webkit-scrollbar { display: none; }
    .ult { flex: none; grid-template-columns: 22px auto; gap: 7px; padding: 6px 10px 6px 7px; }
    .ult .key { display: none; }
    .orb { width: 20px; height: 20px; }
    .ult .nm { font-size: 13px; }
    .ult .nm small { display: none; }
    .detail { padding-top: 8px; gap: 6px; }
    .detail p { font-size: 12.5px; }
    .detail dl, .compare, .badges { display: none; }
    .tally div { padding: 5px 8px; display: flex; align-items: baseline; gap: 6px; }
    .tally b { font-size: 17px; display: inline; }
    .dock {
      left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
      bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); padding: 10px; gap: 10px;
    }
    .fire { width: 80px; height: 80px; }
    .fire .core { width: 68px; height: 68px; }
    .fire b { font-size: 18px; }
    .ctl { flex: 1; min-width: 0; grid-template-columns: minmax(0, 1fr); gap: 6px; }
    .ctl .lbl { display: none; }
    .seg { min-width: 0; }
    .seg button { flex: 1; min-width: 0; padding: 6px 4px; font-size: 12px; white-space: nowrap; }
    .ctl .pair { display: flex; gap: 6px; min-width: 0; }
    .ctl .pair .seg { flex: 1 1 0; }
    .result { left: 50%; top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); }
    .result b { font-size: 24px; }
  }
  /* ---------- short landscape screens (phones on their side) ---------- */
  @media (min-width: 761px) and (max-height: 560px) {
    .lab { width: 236px; padding: 10px; gap: 8px; top: calc(env(safe-area-inset-top, 0px) + 10px); }
    .lab header .eyebrow { display: none; }
    .lab h1 { font-size: 22px; }
    .ults { gap: 4px; }
    .ult { padding: 5px 8px; grid-template-columns: 20px 1fr auto; gap: 8px; }
    .orb { width: 18px; height: 18px; }
    .ult .nm { font-size: 13px; }
    .ult .nm small, .detail dl, .compare, .badges, .keys { display: none; }
    .detail p { font-size: 12px; }
    .tally b { font-size: 17px; }
    .dock { padding: 8px 10px; gap: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); }
    .fire { width: 70px; height: 70px; }
    .fire .core { width: 59px; height: 59px; }
    .fire b { font-size: 16px; }
    .ctl { grid-template-columns: auto; gap: 5px; }
    .ctl .lbl { display: none; }
    .ctl .pair { display: flex; gap: 5px; }
    .seg button { padding: 4px 7px; font-size: 11.5px; }
    .result { left: calc(50% + 124px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .fire.armed { animation: none; }
    .result, #c, .warpfx { transition: none; }
  }
</style>

<div id="stage"><canvas id="c" aria-label="Practice court"></canvas></div>
<div class="warpfx"></div>
<div id="tags"></div>

<aside class="lab panel" id="lab">
  <header>
    <div class="eyebrow">Ultimate Pickleball Clash · practice court</div>
    <h1>Ultimate <span>Lab</span></h1>
  </header>
  <div class="ults" id="ults" role="listbox" aria-label="Ultimates"></div>
  <section class="detail" aria-live="polite">
    <div class="badges"><span class="badge" id="dKind">Shot</span><span class="badge live" id="dLive">In the game</span></div>
    <p id="dDesc"></p>
    <dl id="dStats"></dl>
    <div class="tally">
      <div><b id="tFired">0</b><span>fired</span></div>
      <div class="w"><b id="tWin">0</b><span>winners</span></div>
      <div class="r"><b id="tRet">0</b><span>returned</span></div>
    </div>
    <p class="compare" id="compare"></p>
    <p class="lastshot" id="lastShot"></p>
  </section>
</aside>

<div class="result panel" id="result"><b id="rBig"></b><span id="rSmall"></span></div>

<div class="dock panel" id="dock">
  <button class="fire" id="fire" aria-label="Fire the ultimate (M)"><span class="core"><b id="fireLbl">FIRE</b><small id="fireSub">M key</small></span></button>
  <div class="ctl">
    <span class="lbl">Play</span>
    <div class="pair"><div class="seg" id="autoSeg" role="group" aria-label="Auto-fire"><button data-v="on">Auto-fire</button><button data-v="off">Manual</button></div>
      <div class="seg" id="speedSeg" role="group" aria-label="Game speed"><button data-v="1">1×</button><button data-v="0.5">½×</button><button data-v="0.25">¼×</button></div></div>
    <span class="lbl">Camera</span>
    <div class="seg" id="camSeg" role="group" aria-label="Camera"><button data-v="behind">Behind</button><button data-v="side">Side</button><button data-v="top">Top</button><button data-v="rival">Rivals</button></div>
    <span class="lbl">Show</span>
    <div class="pair"><div class="seg" id="pathSeg" role="group" aria-label="Flight paths"><button data-v="on">Paths</button><button data-v="off">No paths</button></div>
      <div class="seg" id="soundSeg" role="group" aria-label="Sound"><button data-v="on">Sound</button><button data-v="off">Mute</button></div></div>
  </div>
</div>

<div class="keys panel"><kbd>1</kbd>–<kbd>9</kbd>, <kbd>0</kbd>, <kbd>-</kbd>, <kbd>=</kbd> pick · <kbd>M</kbd> fire · <kbd>A</kbd> auto-fire · <kbd>C</kbd> camera · <kbd>S</kbd> speed</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';

  /* =====================================================================
     CHARACTER FACTORY  (copied from characters.html; keep the two in sync)
     Units are feet. Characters face -Z. The rig:
       root ─ rig (height from leg angles) ─┬─ hip ─ knee        (×2 legs)
                                           └─ upper (lean + twist)
                                                ├─ torso, head ─ hair, eyes, mouth
                                                └─ shoulder ─ elbow (×2 arms; right holds the paddle)
     ===================================================================== */
  const TEAM_COLORS = { a: 0xff8a2b, b: 0xb45cff };

  const CHARACTERS = [
    { id: 'you',  name: 'YOU',  team: 'a', role: 'You · orange team',     shirt: TEAM_COLORS.a, shorts: 0x1f2a44, skin: 0xf1c7a3, hair: 'spiky',  hairColor: 0x6b4226, paddle: 0x22c7b8, marker: true },
    { id: 'kai',  name: 'KAI',  team: 'a', role: 'Partner · orange team', shirt: TEAM_COLORS.a, shorts: 0x1f2a44, skin: 0x8d5a3b, hair: 'short',  hairColor: 0x151217, paddle: 0xffd23f },
    { id: 'rex',  name: 'REX',  team: 'b', role: 'Rival · violet team',   shirt: TEAM_COLORS.b, shorts: 0x23193a, skin: 0xc68a5e, hair: 'quiff',  hairColor: 0x2b1d14, paddle: 0xff4f6d },
    { id: 'juno', name: 'JUNO', team: 'b', role: 'Rival · violet team',   shirt: TEAM_COLORS.b, shorts: 0x23193a, skin: 0xffdcc2, hair: 'pony',   hairColor: 0xd9a441, paddle: 0x3fa9ff },
  ];

  // Leg and arm segment lengths (ft). HIP = THIGH + SHIN + ankle-to-floor.
  const THIGH = 1.05, SHIN = 1.27, ANKLE = 0.13, HIP = THIGH + SHIN + ANKLE;
  const UPPER_ARM = 0.74, FOREARM = 0.7;
  const HEAD_Y = 2.75, HEAD_R = 0.62;
  const mat = (color, roughness = 0.75) => new THREE.MeshStandardMaterial({ color, roughness, metalness: 0 });

  const TORSO_PROFILE = [
    [0.0, 0.2], [0.57, 0.22], [0.62, 0.5], [0.62, 0.95], [0.69, 1.35], [0.72, 1.62],
    [0.69, 1.84], [0.57, 2.0], [0.38, 2.11], [0.18, 2.16], [0.0, 2.17],
  ];
  // Smooth a [radius, height] profile with a spline and spin it into a
  // solid. from/to keep just one height band (for the chest stripe); grow
  // pushes that band slightly outside the shirt so it never z-fights.
  function latheProfile(profile, opts = {}) {
    const curve = new THREE.SplineCurve(profile.map(([r, y]) => new THREE.Vector2(r, y)));
    let pts = curve.getPoints(48).map((v) => new THREE.Vector2(Math.max(0, v.x), v.y));
    if (opts.from !== undefined) pts = pts.filter((v) => v.y >= opts.from && v.y <= opts.to);
    if (opts.grow) pts = pts.map((v) => new THREE.Vector2(v.x * opts.grow, v.y));
    return new THREE.LatheGeometry(pts, 32);
  }

  // Extrude a side-profile shape across the foot and turn it so the profile's
  // +u points toward the toes (-Z) and the width runs along X.
  function sneakerPart(draw, width, bevel) {
    const s = new THREE.Shape();
    draw(s);
    const g = new THREE.ExtrudeGeometry(s, {
      depth: width, curveSegments: 8,
      bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3,
    });
    g.translate(0, 0, -width / 2);
    g.rotateY(Math.PI / 2);
    return g;
  }

  // Shared geometry, so four characters cost little more than one.
  const GEO = {
    thigh: new THREE.CylinderGeometry(0.23, 0.2, THIGH, 12),
    shin: new THREE.CylinderGeometry(0.2, 0.17, SHIN - 0.15, 12),
    knee: new THREE.SphereGeometry(0.2, 12, 10),
    sock: new THREE.CylinderGeometry(0.185, 0.18, 0.28, 12),
    // Sneaker: a side-profile outline (u = toe direction, v = up) extruded
    // across the foot with bevelled edges, so it is rounded on every side.
    shoeUpper: sneakerPart((s) => {
      s.moveTo(-0.27, 0);
      s.lineTo(0.3, 0);
      s.quadraticCurveTo(0.44, 0, 0.44, 0.1);    // rounded toe
      s.quadraticCurveTo(0.43, 0.2, 0.25, 0.22); // toe box slopes up
      s.lineTo(0.06, 0.3);                       // laces up to the ankle
      s.lineTo(-0.19, 0.32);                     // collar
      s.quadraticCurveTo(-0.31, 0.3, -0.31, 0.15); // curved heel
      s.quadraticCurveTo(-0.31, 0, -0.27, 0);
    }, 0.28, 0.045),
    shoeSole: sneakerPart((s) => {
      s.moveTo(-0.27, 0);
      s.lineTo(0.39, 0);
      s.quadraticCurveTo(0.46, 0, 0.46, 0.04);
      s.quadraticCurveTo(0.46, 0.08, 0.39, 0.08);
      s.lineTo(-0.27, 0.08);
      s.quadraticCurveTo(-0.34, 0.08, -0.34, 0.04);
      s.quadraticCurveTo(-0.34, 0, -0.27, 0);
    }, 0.31, 0.03),
    // Torso and shorts are lathed from smooth side profiles (radius, height
    // in upper-body space): waist taper, fuller chest, shoulders that round
    // over into the neck. See latheProfile() below.
    shorts: latheProfile([[0.0, -0.27], [0.3, -0.26], [0.55, -0.23], [0.64, -0.1], [0.66, 0.15], [0.64, 0.42], [0.6, 0.56]]),
    torso: latheProfile(TORSO_PROFILE),
    stripe: latheProfile(TORSO_PROFILE, { from: 1.3, to: 1.46, grow: 1.025 }),
    collar: new THREE.TorusGeometry(0.24, 0.05, 8, 24),
    sleeve: new THREE.CylinderGeometry(0.195, 0.175, 0.38, 14),
    neck: new THREE.CylinderGeometry(0.2, 0.22, 0.32, 10),
    head: new THREE.SphereGeometry(HEAD_R, 24, 18),
    eye: new THREE.SphereGeometry(0.12, 14, 10),
    shine: new THREE.SphereGeometry(0.038, 8, 6),
    mouth: new THREE.TorusGeometry(0.14, 0.03, 6, 16, Math.PI),
    hairCap: new THREE.SphereGeometry(HEAD_R + 0.05, 24, 12, 0, Math.PI * 2, 0, Math.PI * 0.56),
    blob: new THREE.SphereGeometry(0.3, 12, 10),
    shoulder: new THREE.SphereGeometry(0.21, 16, 12),
    upperArm: new THREE.CylinderGeometry(0.17, 0.15, UPPER_ARM, 10),
    elbow: new THREE.SphereGeometry(0.15, 10, 8),
    forearm: new THREE.CylinderGeometry(0.15, 0.13, FOREARM, 10),
    hand: new THREE.SphereGeometry(0.17, 10, 8),
    grip: new THREE.CylinderGeometry(0.075, 0.07, 0.52, 8),
    face: (() => {
      const w = 0.8, h = 0.96, r = 0.2, s = new THREE.Shape();
      s.moveTo(-w / 2 + r, -h / 2);
      s.lineTo(w / 2 - r, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
      s.lineTo(w / 2, h / 2 - r);  s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
      s.lineTo(-w / 2 + r, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
      s.lineTo(-w / 2, -h / 2 + r); s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
      const g = new THREE.ExtrudeGeometry(s, { depth: 0.07, bevelEnabled: false, curveSegments: 6 });
      g.translate(0, 0, -0.035);
      return g;
    })(),
    marker: new THREE.ConeGeometry(0.34, 0.75, 4),
    buzz: new THREE.SphereGeometry(HEAD_R + 0.035, 24, 9, 0, Math.PI * 2, 0, Math.PI * 0.5),
    spike: new THREE.ConeGeometry(0.13, 0.42, 8),
  };

  /* ---------- hairstyles ----------
     Each builder adds meshes to the head's hair group. Head-local space:
     head centre at the origin, radius HEAD_R, face toward -Z. */
  const UP = new THREE.Vector3(0, 1, 0);
  function part(g, geo, m, pos, scale, rot) {
    const o = new THREE.Mesh(geo, m);
    o.position.set(pos[0], pos[1], pos[2]);
    if (scale) o.scale.set(scale[0], scale[1], scale[2]);
    if (rot) o.rotation.set(rot[0], rot[1], rot[2]);
    g.add(o);
    return o;
  }
  // A direction on the head: tilt = angle down from the crown, turn = angle
  // around the head (0 = back of head, PI = face).
  const onHead = (tilt, turn) => new THREE.Vector3(Math.sin(tilt) * Math.sin(turn), Math.cos(tilt), Math.sin(tilt) * Math.cos(turn));
  const cap = (g, m, s = 1) => part(g, GEO.hairCap, m, [0, 0.02, 0.04], [s, s, s], [0.42, 0, 0]);

  const HAIR = {
    short:  { label: 'Short', build: (g, m) => cap(g, m, 1.05) },
    buzz:   { label: 'Buzz cut', build: (g, m) => part(g, GEO.buzz, m, [0, 0, 0.02], null, [0.5, 0, 0]) },
    quiff:  { label: 'Quiff', build: (g, m) => {
      cap(g, m);
      part(g, GEO.blob, m, [0, 0.5, -0.4], [1.35, 0.5, 0.85], [-0.45, 0, 0]);
    } },
    spiky:  { label: 'Spiky', build: (g, m) => {
      cap(g, m);
      const spots = [[0, 0], [0.5, 0], [0.5, 1.26], [0.5, 2.51], [0.5, 3.77], [0.5, 5.03], [0.95, 0.6], [0.95, 5.68], [0.95, 0]];
      for (const [tilt, turn] of spots) {
        const dir = onHead(tilt, turn);
        const s = part(g, GEO.spike, m, dir.clone().multiplyScalar(HEAD_R + 0.14).toArray());
        s.quaternion.setFromUnitVectors(UP, dir);
      }
    } },
    mohawk: { label: 'Mohawk', build: (g, m) => {
      for (let i = 0; i < 6; i++) {
        const a = -0.75 + i * 0.32; // front (-) to back (+)
        part(g, GEO.blob, m, [0, Math.cos(a) * (HEAD_R + 0.1), Math.sin(a) * (HEAD_R + 0.1)], [0.32, 0.8, 0.55], [a, 0, 0]);
      }
    } },
    curly:  { label: 'Curly', build: (g, m) => {
      cap(g, m, 0.98);
      for (const tilt of [0.2, 0.62, 1.05]) {
        const n = tilt < 0.3 ? 3 : tilt < 0.8 ? 7 : 8;
        for (let i = 0; i < n; i++) {
          const turn = (i / n) * Math.PI * 2 + tilt;
          const dir = onHead(tilt, turn);
          if (tilt > 0.8 && dir.z < -0.15) continue; // keep the face clear
          part(g, GEO.blob, m, dir.multiplyScalar(HEAD_R + 0.04).toArray(), [0.62, 0.62, 0.62]);
        }
      }
    } },
    afro:   { label: 'Afro', build: (g, m) => part(g, GEO.blob, m, [0, 0.38, 0.26], [2.9, 2.55, 2.7]) },
    bun:    { label: 'Top bun', build: (g, m) => {
      cap(g, m);
      part(g, GEO.blob, m, [0, 0.66, 0.22], [0.85, 0.8, 0.85]);
    } },
    pony:   { label: 'Ponytail', build: (g, m) => {
      cap(g, m);
      part(g, GEO.blob, m, [0, 0.12, 0.66], [0.9, 0.9, 0.9]);
      part(g, GEO.blob, m, [0, -0.25, 0.78], [0.7, 1.3, 0.7]);
    } },
    pigtails: { label: 'Pigtails', build: (g, m) => {
      cap(g, m);
      part(g, GEO.blob, m, [-0.68, -0.12, 0.16], [0.55, 1.15, 0.55], [0, 0, -0.3]);
      part(g, GEO.blob, m, [0.68, -0.12, 0.16], [0.55, 1.15, 0.55], [0, 0, 0.3]);
    } },
  };
  const HAIR_STYLES = Object.keys(HAIR);

  function createCharacter(def) {
    const M = {
      skin: mat(def.skin, 0.8), shirt: mat(def.shirt, 0.7), shorts: mat(def.shorts, 0.85),
      shoe: mat(TEAM_COLORS[def.team], 0.55), sole: mat(0xf2f4f8, 0.8), sock: mat(0xffffff, 0.9),
      hair: new THREE.MeshStandardMaterial({ color: def.hairColor, roughness: 0.9, side: THREE.DoubleSide }),
      eye: mat(0x14141c, 0.25), shine: new THREE.MeshBasicMaterial({ color: 0xffffff }),
      mouth: mat(0x5a1e24, 0.6), paddle: mat(def.paddle, 0.45), grip: mat(0x23232b, 0.95),
      stripe: mat(0xffffff, 0.7),
    };
    const mesh = (geo, m, x = 0, y = 0, z = 0) => {
      const o = new THREE.Mesh(geo, m);
      o.position.set(x, y, z);
      o.castShadow = true;
      return o;
    };
    const joint = (parent, x, y, z) => {
      const g = new THREE.Group();
      g.position.set(x, y, z);
      parent.add(g);
      return g;
    };

    const root = new THREE.Group();
    const rig = new THREE.Group();
    root.add(rig);

    // Legs: hip joint -> thigh -> knee joint -> shin + foot.
    const makeLeg = (x) => {
      const hip = joint(rig, x, HIP, 0);
      hip.add(mesh(GEO.thigh, M.skin, 0, -THIGH / 2, 0));
      const knee = joint(hip, 0, -THIGH, 0);
      knee.add(mesh(GEO.knee, M.skin));
      knee.add(mesh(GEO.shin, M.skin, 0, -(SHIN - 0.15) / 2, 0));
      knee.add(mesh(GEO.sock, M.sock, 0, -SHIN + 0.2, 0));
      // Shoe origin sits on the floor under the ankle; sole first, upper on it.
      const shoe = joint(knee, 0, -SHIN - ANKLE, -0.06);
      shoe.add(mesh(GEO.shoeSole, M.sole, 0, 0.03, 0));
      shoe.add(mesh(GEO.shoeUpper, M.shoe, 0, 0.075, 0));
      return { hip, knee };
    };
    const legL = makeLeg(-0.3);
    const legR = makeLeg(0.3);

    // Upper body pivots at the hip for lean and shoulder twist.
    const upper = joint(rig, 0, HIP, 0);
    // Slightly flattened front-to-back so the body reads as a chest, not a can.
    const DEPTH = 0.8;
    const shorts = mesh(GEO.shorts, M.shorts);
    shorts.scale.z = 0.86;
    upper.add(shorts);
    const torso = mesh(GEO.torso, M.shirt);
    torso.scale.z = DEPTH;
    upper.add(torso);
    const stripe = mesh(GEO.stripe, M.stripe);
    stripe.scale.z = DEPTH;
    upper.add(stripe);
    upper.add(mesh(GEO.neck, M.skin, 0, 2.2, 0));
    const collar = mesh(GEO.collar, M.stripe, 0, 2.1, 0);
    collar.rotation.x = Math.PI / 2;
    collar.scale.set(1.15, 1.0, 1);
    upper.add(collar);

    // Head: skin sphere, big round eyes with a highlight, a smile.
    const head = joint(upper, 0, HEAD_Y, 0);
    head.add(mesh(GEO.head, M.skin));
    for (const sx of [-1, 1]) {
      const eye = mesh(GEO.eye, M.eye, sx * 0.23, 0.08, -0.53);
      eye.scale.set(0.9, 1.15, 0.55);
      head.add(eye);
      const shine = new THREE.Mesh(GEO.shine, M.shine);
      shine.position.set(sx * 0.23 + 0.04, 0.14, -0.6);
      head.add(shine);
    }
    const mouth = mesh(GEO.mouth, M.mouth, 0, -0.2, -0.575);
    mouth.rotation.set(-0.35, 0, Math.PI);
    mouth.scale.set(1, 0.75, 1);
    head.add(mouth);

    // Hair lives in its own group so the style can be swapped at runtime.
    const hair = joint(head, 0, 0, 0);
    function setHair(style) {
      while (hair.children.length) hair.remove(hair.children[0]);
      (HAIR[style] || HAIR.short).build(hair, M.hair);
      hair.traverse((o) => { if (o.isMesh) o.castShadow = true; });
      def.hair = HAIR[style] ? style : 'short';
    }
    setHair(def.hair);

    // Arms: shoulder (rotation order YXZ: yaw applied last) -> upper arm ->
    // elbow (bends on X) -> forearm -> hand. The paddle rides the right hand.
    const makeArm = (x) => {
      const shoulder = joint(upper, x, 1.86, 0);
      shoulder.rotation.order = 'YXZ';
      shoulder.add(mesh(GEO.shoulder, M.shirt));
      shoulder.add(mesh(GEO.sleeve, M.shirt, 0, -0.2, 0));
      shoulder.add(mesh(GEO.upperArm, M.skin, 0, -UPPER_ARM / 2, 0));
      const elbow = joint(shoulder, 0, -UPPER_ARM, 0);
      elbow.add(mesh(GEO.elbow, M.skin));
      elbow.add(mesh(GEO.forearm, M.skin, 0, -FOREARM / 2, 0));
      elbow.add(mesh(GEO.hand, M.skin, 0, -FOREARM - 0.05, 0));
      return { shoulder, elbow };
    };
    const armL = makeArm(-0.86);
    const armR = makeArm(0.86);

    const paddle = joint(armR.elbow, 0, -FOREARM - 0.08, 0);
    paddle.add(mesh(GEO.grip, M.grip, 0, -0.2, 0));
    paddle.add(mesh(GEO.face, M.paddle, 0, -0.9, 0));

    let marker = null;
    if (def.marker) {
      marker = new THREE.Mesh(GEO.marker, new THREE.MeshStandardMaterial({
        color: TEAM_COLORS.a, emissive: TEAM_COLORS.a, emissiveIntensity: 0.45, roughness: 0.5,
      }));
      marker.rotation.x = Math.PI;
      marker.position.y = 6.75;
      root.add(marker);
    }

    /* Pose channels (radians). Positive hip = thigh forward, negative knee =
       shin folds back. Positive elbow = forearm folds forward. Arms: x lifts
       forward, y swings across the body (forehand = negative to positive),
       z lifts out to the side. Channels blend toward a target each frame. */
    const cur = {
      lean: -0.18, twist: 0, bounce: 0,
      hipL: 0.35, kneeL: -0.6, hipR: 0.35, kneeR: -0.6,
      lx: 0.3, ly: 0, lz: -0.3, elL: 1.1,
      rx: 0.3, ry: -0.3, rz: 0.3, elR: 1.0,
      roll: 0, // paddle roll about the arm: PI/2 turns the face to lead the swing
    };

    // Overhead smash, 1.6 s loop, as keyframes (p = 0..1 through the loop).
    // Load into the trophy pose (side-on, free hand pointing up, paddle
    // dropped behind the head), drive up and uncoil so the elbow snaps
    // straight at contact high in front, then pull down across the body.
    const READY_POSE = {
      lean: -0.18, twist: 0, bounce: 0,
      hipL: 0.35, kneeL: -0.6, hipR: 0.35, kneeR: -0.6,
      lx: 0.3, ly: 0, lz: -0.3, elL: 1.1,
      rx: 0.3, ry: -0.3, rz: 0.3, elR: 1.0, roll: 0,
    };
    const OVERHEAD = [
      { p: 0, pose: READY_POSE },
      { p: 0.32, pose: { lean: 0.08, twist: -0.6, bounce: 0, hipL: 0.55, kneeL: -1.0, hipR: 0.3, kneeR: -0.8,
        lx: 2.7, ly: 0, lz: -0.15, elL: 0.15, rx: 2.5, ry: 0, rz: 0.35, elR: 2.0, roll: 0 } },
      { p: 0.4, pose: { lean: 0.06, twist: -0.62, bounce: 0, hipL: 0.58, kneeL: -1.05, hipR: 0.32, kneeR: -0.85,
        lx: 2.75, ly: 0, lz: -0.15, elL: 0.15, rx: 2.5, ry: 0, rz: 0.35, elR: 2.05, roll: 0 } },
      { p: 0.47, pose: { lean: -0.05, twist: 0.05, bounce: 0.12, hipL: 0.15, kneeL: -0.2, hipR: 0.1, kneeR: -0.2,
        lx: 1.0, ly: 0.3, lz: -0.3, elL: 1.3, rx: 2.9, ry: 0, rz: 0.2, elR: 0.1, roll: 0 } },
      { p: 0.62, pose: { lean: -0.4, twist: 0.5, bounce: 0, hipL: 0.4, kneeL: -0.6, hipR: 0.2, kneeR: -0.5,
        lx: 0.5, ly: 0.4, lz: -0.4, elL: 1.2, rx: 0.8, ry: 0.6, rz: 0.1, elR: 0.4, roll: 0 } },
      { p: 1, pose: READY_POSE },
    ];
    function keyed(frames, p) {
      let i = 0;
      while (i < frames.length - 2 && p >= frames[i + 1].p) i++;
      const a = frames[i], b = frames[i + 1];
      let k = Math.min(1, Math.max(0, (p - a.p) / (b.p - a.p)));
      k = k * k * (3 - 2 * k); // smoothstep
      const out = {};
      for (const key in a.pose) out[key] = a.pose[key] + (b.pose[key] - a.pose[key]) * k;
      return out;
    }

    function targetPose(mode, t) {
      if (mode === 'overhead') return keyed(OVERHEAD, (t % 1.6) / 1.6);
      if (mode === 'run') {
        const f = t * 9.5, sL = Math.sin(f), cL = Math.cos(f);
        return {
          lean: -0.3, twist: sL * 0.12, bounce: Math.abs(sL) * 0.12,
          // Knee folds most while the leg swings forward from behind.
          hipL: 0.65 * sL,  kneeL: -0.25 - 1.1 * Math.max(0, cL),
          hipR: -0.65 * sL, kneeR: -0.25 - 1.1 * Math.max(0, -cL),
          lx: 0.1 - 0.75 * sL, ly: 0, lz: -0.2, elL: 1.45,
          rx: 0.25 + 0.55 * sL, ry: -0.35, rz: 0.3, elR: 1.25, roll: 0,
        };
      }
      if (mode === 'backhand') {
        // Flat one-handed backhand, 1.5 s loop. Mirror of the forehand: the
        // shoulders coil left and the paddle goes back past the left hip
        // with a bent elbow (left hand guiding it), then the arm extends and
        // sweeps left-to-right on a level path. Contact is out in front on
        // the left, where the rolled face looks straight at the net.
        const p = (t % 1.5) / 1.5;
        const ease = (k) => 1 - Math.pow(1 - k, 3);
        let ry, twist, elR, knee, lx, ly, lz, elL;
        if (p < 0.3) {            // coil: paddle back to the left hip
          const k = ease(p / 0.3);
          ry = 0.4 + 0.2 * k; twist = 1.1 * k; elR = 0.6 - 0.25 * k; knee = -0.6 - 0.25 * k;
          lx = 0.6 + 0.3 * k; ly = 0.3 * k; lz = -0.25 + 0.15 * k; elL = 1.0 + 0.3 * k;
        } else if (p < 0.42) {    // uncoil: level sweep, elbow straightens
          const k = ease((p - 0.3) / 0.12);
          ry = 0.6 - 0.6 * k; twist = 1.1 - 1.3 * k; elR = 0.35 - 0.25 * Math.min(1, k * 2); knee = -0.85 + 0.3 * k;
          lx = 0.9 - 1.2 * k; ly = 0.3 - 0.3 * k; lz = -0.1 - 0.5 * k; elL = 1.3 - 1.0 * k;
        } else {                  // hold the finish, then back to ready
          const k = ease(Math.min(1, (p - 0.42) / 0.5));
          ry = 0.4 * k; twist = -0.2 * (1 - k); elR = 0.1 + 0.5 * k; knee = -0.55 - 0.05 * k;
          lx = -0.3 + 0.9 * k; ly = 0; lz = -0.6 + 0.35 * k; elL = 0.3 + 0.7 * k;
        }
        return {
          lean: -0.2, twist, bounce: 0,
          // closed stance: right foot steps across toward the ball
          hipL: 0.15, kneeL: knee + 0.2, hipR: 0.5, kneeR: knee - 0.15,
          lx, ly, lz, elL,
          rx: 1.0, ry, rz: 0, elR, roll: Math.PI / 2,
        };
      }
      if (mode === 'swing') {
        // Flat forehand, 1.5 s loop. The arm sweeps around the body on a
        // level, waist-high path (fixed tilt, no side lift), and the paddle is
        // rolled so its face stays upright and leads the swing. Contact is
        // out to the side, where the face looks straight at the net.
        const p = (t % 1.5) / 1.5;
        const ease = (k) => 1 - Math.pow(1 - k, 3);
        const READY = -0.9, BACK = -2.5, THROUGH = 0.5;
        let ry, twist, elR, knee;
        if (p < 0.3) {            // take the paddle straight back
          const k = ease(p / 0.3);
          ry = READY + (BACK - READY) * k; twist = -0.6 * k; elR = 0.5 + 0.1 * k; knee = -0.6 - 0.25 * k;
        } else if (p < 0.42) {    // sweep through level, arm extending
          const k = ease((p - 0.3) / 0.12);
          ry = BACK + (THROUGH - BACK) * k; twist = -0.6 + 1.05 * k; elR = 0.6 - 0.45 * k; knee = -0.85 + 0.3 * k;
        } else {                  // finish across the body, settle to ready
          const k = ease(Math.min(1, (p - 0.42) / 0.5));
          ry = THROUGH + (READY - THROUGH) * k; twist = 0.45 * (1 - k); elR = 0.15 + 0.35 * k; knee = -0.55 - 0.05 * k;
        }
        return {
          lean: -0.2, twist, bounce: 0,
          hipL: 0.5, kneeL: knee - 0.15, hipR: 0.15, kneeR: knee + 0.2,
          lx: 0.9, ly: 0.4, lz: -0.35, elL: 0.6,
          rx: 1.0, ry, rz: 0, elR, roll: Math.PI / 2,
        };
      }
      // idle: athletic ready stance, knees soft, paddle up in front
      const b = Math.sin(t * 2.2);
      return {
        lean: -0.18, twist: Math.sin(t * 0.9) * 0.05, bounce: 0,
        hipL: 0.35 + b * 0.04, kneeL: -0.6 - b * 0.08,
        hipR: 0.35 + b * 0.04, kneeR: -0.6 - b * 0.08,
        lx: 0.3, ly: 0, lz: -0.3, elL: 1.1 + b * 0.05,
        rx: 0.3, ry: -0.3, rz: 0.3, elR: 1.0 + b * 0.05, roll: 0,
      };
    }

    // Height of the hip above the floor for a given thigh/knee angle, so a
    // crouch lowers the body and the feet stay planted.
    const legHeight = (hip, knee) => THIGH * Math.cos(hip) + SHIN * Math.cos(hip + knee) + ANKLE;

    function update(mode, t, dt) {
      const tgt = targetPose(mode, t);
      const k = 1 - Math.exp(-dt * (mode === 'swing' || mode === 'backhand' || mode === 'overhead' ? 30 : 12));
      for (const key in cur) cur[key] += (tgt[key] - cur[key]) * k;

      legL.hip.rotation.x = cur.hipL;  legL.knee.rotation.x = cur.kneeL;
      legR.hip.rotation.x = cur.hipR;  legR.knee.rotation.x = cur.kneeR;
      const stand = Math.max(legHeight(cur.hipL, cur.kneeL), legHeight(cur.hipR, cur.kneeR));
      rig.position.y = stand - HIP + cur.bounce;

      upper.rotation.x = cur.lean;
      upper.rotation.y = cur.twist;
      head.rotation.x = -cur.lean * 0.7; // keep eyes level when leaning
      armL.shoulder.rotation.set(cur.lx, cur.ly, cur.lz);
      armL.elbow.rotation.x = cur.elL;
      armR.shoulder.rotation.set(cur.rx, cur.ry, cur.rz);
      armR.elbow.rotation.x = cur.elR;
      paddle.rotation.y = cur.roll;

      if (marker) {
        marker.position.y = 6.75 + Math.sin(t * 3) * 0.15;
        marker.rotation.y = t * 1.5;
      }
    }

    return { def, root, update, setHair };
  }

  window.KitchenClash = Object.assign(window.KitchenClash || {}, { createCharacter, CHARACTERS, TEAM_COLORS, HAIR, HAIR_STYLES });

  /* =====================================================================
     COURT  (feet; net on z = 0, your team plays the +Z half)
     ===================================================================== */
  const COURT = {
    halfW: 10,        // 20 ft wide
    halfL: 22,        // 44 ft long
    kitchen: 7,       // non-volley zone depth from the net
    line: 2 / 12,     // 2-inch lines
    netCenter: 34 / 12,
    netPost: 36 / 12,
    postX: 11,        // posts stand 1 ft outside each sideline
  };
  const AREA = { halfW: 17, halfL: 32 }; // fenced play area

  const isTouch = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;

  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.75 : 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  {
    const c = document.createElement('canvas');
    c.width = 4; c.height = 256;
    const g = c.getContext('2d');
    const grad = g.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, '#4f9fea');
    grad.addColorStop(0.55, '#a9d6ff');
    grad.addColorStop(1, '#e6f3ff');
    g.fillStyle = grad;
    g.fillRect(0, 0, 4, 256);
    scene.background = new THREE.CanvasTexture(c);
  }
  scene.fog = new THREE.Fog(0xcde6fb, 120, 260);

  scene.add(new THREE.HemisphereLight(0xe6f3ff, 0x3f5f45, 0.72));
  const sun = new THREE.DirectionalLight(0xffffff, 0.9);
  sun.position.set(-22, 48, 26);
  sun.castShadow = true;
  sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
  Object.assign(sun.shadow.camera, { left: -38, right: 38, top: 40, bottom: -40, near: 1, far: 140 });
  sun.shadow.bias = -0.0005;
  scene.add(sun);
  scene.add(sun.target);

  const stdMat = (color, roughness = 0.85) => new THREE.MeshStandardMaterial({ color, roughness, metalness: 0 });

  function flat(w, l, color, y, x = 0, z = 0) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, l), stdMat(color, 0.92));
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, y, z);
    m.receiveShadow = true;
    scene.add(m);

  }

  // Ground, apron, playing surface, kitchens.
  flat(600, 600, 0x5d8f4a, -0.05);
  flat(AREA.halfW * 2, AREA.halfL * 2, 0x1f6b57, 0);
  flat(COURT.halfW * 2, COURT.halfL * 2, 0x2a56c6, 0.01);
  flat(COURT.halfW * 2, COURT.kitchen, 0x58a6ea, 0.015, 0, COURT.kitchen / 2);
  flat(COURT.halfW * 2, COURT.kitchen, 0x58a6ea, 0.015, 0, -COURT.kitchen / 2);

  // Lines (2 in wide). Lines count as in, so they sit on the court's edges.
  {
    const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 });
    const L = COURT.line, W = COURT.halfW, H = COURT.halfL, K = COURT.kitchen;
    const strip = (w, l, x, z) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, l), lineMat);
      m.rotation.x = -Math.PI / 2;
      m.position.set(x, 0.02, z);
      m.receiveShadow = true;
      scene.add(m);
    };
    for (const s of [-1, 1]) {
      strip(L, H * 2, s * (W - L / 2), 0);          // sidelines
      strip(W * 2, L, 0, s * (H - L / 2));          // baselines
      strip(W * 2, L, 0, s * (K - L / 2));          // kitchen (non-volley) lines
      strip(L, H - K, 0, s * (K + (H - K) / 2));    // centrelines, kitchen line to baseline
    }
  }

  // Net: sagging mesh, white tape along the top, centre strap, two posts.
  {
    const netH = (x) => COURT.netCenter + (COURT.netPost - COURT.netCenter) * Math.pow(x / COURT.postX, 2);
    const geo = new THREE.PlaneGeometry(COURT.postX * 2, 1, 66, 1);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      pos.setY(i, pos.getY(i) > 0 ? netH(x) : 0.15);
    }
    geo.computeVertexNormals();
    const tc = document.createElement('canvas');
    tc.width = 64; tc.height = 64;
    const g = tc.getContext('2d');
    g.strokeStyle = 'rgba(20, 22, 30, 0.95)';
    g.lineWidth = 6;
    g.strokeRect(0, 0, 64, 64);
    const tex = new THREE.CanvasTexture(tc);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(COURT.postX * 2 / 0.25, COURT.netCenter / 0.25);
    tex.anisotropy = 4;
    const net = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      map: tex, transparent: true, alphaTest: 0.3, side: THREE.DoubleSide, roughness: 0.9,
    }));
    net.castShadow = true;
    scene.add(net);

    const top = [];
    for (let i = 0; i <= 24; i++) {
      const x = -COURT.postX + (i / 24) * COURT.postX * 2;
      top.push(new THREE.Vector3(x, netH(x), 0));
    }
    const tape = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(top), 48, 0.07, 6, false), stdMat(0xffffff, 0.6));
    tape.castShadow = true;
    scene.add(tape);

    const strap = new THREE.Mesh(new THREE.BoxGeometry(0.17, COURT.netCenter, 0.05), stdMat(0xffffff, 0.6));
    strap.position.y = COURT.netCenter / 2;
    scene.add(strap);

    const postGeo = new THREE.CylinderGeometry(0.12, 0.14, COURT.netPost + 0.15, 12);
    for (const s of [-1, 1]) {
      const post = new THREE.Mesh(postGeo, stdMat(0x23262e, 0.5));
      post.position.set(s * COURT.postX, (COURT.netPost + 0.15) / 2, 0);
      post.castShadow = true;
      scene.add(post);
      const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 0.12, 16), stdMat(0x23262e, 0.5));
      foot.position.set(s * COURT.postX, 0.06, 0);
      scene.add(foot);
    }
  }

  // Fences: tall chain-link on the sides, low windscreens behind the baselines
  // so the camera behind your baseline sees over them.
  {
    const lc = document.createElement('canvas');
    lc.width = 32; lc.height = 32;
    const g = lc.getContext('2d');
    g.strokeStyle = 'rgba(40, 52, 58, 0.9)';
    g.lineWidth = 2.2;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(32, 32); g.moveTo(32, 0); g.lineTo(0, 32); g.stroke();
    const tex = new THREE.CanvasTexture(lc);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    const FENCE_H = 10;
    const chain = (len) => {
      const t = tex.clone();
      t.needsUpdate = true;
      t.repeat.set(len / 1.4, FENCE_H / 1.4);
      return new THREE.MeshStandardMaterial({ map: t, transparent: true, alphaTest: 0.35, side: THREE.DoubleSide, roughness: 0.8 });
    };
    const poleMat = stdMat(0x2b3a33, 0.5);
    const poleGeo = new THREE.CylinderGeometry(0.1, 0.1, FENCE_H, 8);
    const railGeo = new THREE.CylinderGeometry(0.08, 0.08, 1, 8);
    for (const s of [-1, 1]) {
      const len = AREA.halfL * 2;
      const side = new THREE.Mesh(new THREE.PlaneGeometry(len, FENCE_H), chain(len));
      side.rotation.y = Math.PI / 2;
      side.position.set(s * AREA.halfW, FENCE_H / 2, 0);
      scene.add(side);
      for (let z = -AREA.halfL; z <= AREA.halfL; z += 8) {
        const p = new THREE.Mesh(poleGeo, poleMat);
        p.position.set(s * AREA.halfW, FENCE_H / 2, z);
        p.castShadow = true;
        scene.add(p);
      }
      const rail = new THREE.Mesh(railGeo, poleMat);
      rail.scale.y = len;
      rail.rotation.x = Math.PI / 2;
      rail.position.set(s * AREA.halfW, FENCE_H, 0);
      scene.add(rail);

      const screen = new THREE.Mesh(new THREE.BoxGeometry(AREA.halfW * 2, 3.2, 0.15), stdMat(0x17463a, 0.9));
      screen.position.set(0, 1.6, s * AREA.halfL);
      screen.receiveShadow = true;
      scene.add(screen);
    }
  }

  // Bleachers with a crowd, both long sides.
  const crowd = (() => {
    const seatMat = stdMat(0x9aa4b5, 0.7);
    const spots = [];
    for (const s of [-1, 1]) {
      for (let row = 0; row < 4; row++) {
        const x = s * (21 + row * 2.4), h = 1.1 + row * 1.15;
        const tier = new THREE.Mesh(new THREE.BoxGeometry(2.4, h, 48), seatMat);
        tier.position.set(x, h / 2, 0);
        tier.receiveShadow = true;
        tier.castShadow = true;
        scene.add(tier);
        for (let z = -22.5; z <= 22.5; z += 2.1) {
          if (Math.random() < 0.3) continue;
          spots.push({ x: x + (Math.random() - 0.5) * 0.4, y: h, z: z + (Math.random() - 0.5) * 0.5, phase: Math.random() * 6.28 });
        }
      }
    }
    const shirts = [0xe94f4f, 0xf2b134, 0x3fa9ff, 0x2fbf71, 0xffffff, 0x8458d8, 0xff8a2b, 0x1f2a44, 0xf06ab0];
    const skins = [0xf1c7a3, 0x8d5a3b, 0xc68a5e, 0xffdcc2, 0x5a3825, 0xe0ac7e];
    const body = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.42, 0.5, 1.7, 8), stdMat(0xffffff, 0.8), spots.length);
    const head = new THREE.InstancedMesh(new THREE.SphereGeometry(0.36, 10, 8), stdMat(0xffffff, 0.8), spots.length);
    const col = new THREE.Color();
    spots.forEach((p, i) => {
      body.setColorAt(i, col.setHex(shirts[i % shirts.length]));
      head.setColorAt(i, col.setHex(skins[(i * 7) % skins.length]));
    });
    body.castShadow = true;
    scene.add(body, head);
    const m = new THREE.Matrix4();
    return {
      update(t, excite = 0) {
        spots.forEach((p, i) => {
          // Idle sway, plus jumping when your team wins a point.
          const bob = Math.max(0, Math.sin(t * 1.3 + p.phase)) * 0.06 +
            Math.min(1, excite) * Math.abs(Math.sin(t * 9 + p.phase * 3)) * 0.9;
          m.makeTranslation(p.x, p.y + 0.85 + bob, p.z);
          body.setMatrixAt(i, m);
          m.makeTranslation(p.x, p.y + 2.05 + bob, p.z);
          head.setMatrixAt(i, m);
        });
        body.instanceMatrix.needsUpdate = true;
        head.instanceMatrix.needsUpdate = true;
      },
    };
  })();

  // Light poles at the corners, and a ring of simple trees in the distance.
  {
    const poleMat = stdMat(0x3a4150, 0.5);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 30, 10), poleMat);
      pole.position.set(sx * 19, 15, sz * 34);
      pole.castShadow = true;
      scene.add(pole);
      const lamp = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.6, 0.8), stdMat(0xe8edf5, 0.4));
      lamp.position.set(sx * 19, 30.5, sz * 34 - sz * 0.6);
      lamp.lookAt(0, 0, 0);
      scene.add(lamp);
    }
    const n = 46;
    const leaves = new THREE.InstancedMesh(new THREE.ConeGeometry(4.2, 11, 8), stdMat(0x2f6b3c, 0.9), n);
    const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.5, 0.7, 3, 6), stdMat(0x5b4030, 0.9), n);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.sin(i * 12.9) * 0.05;
      const r = 70 + ((i * 37) % 23);
      const k = 0.8 + ((i * 53) % 10) / 20;
      p.set(Math.cos(a) * r, 0, Math.sin(a) * r * 1.15);
      s.set(k, k, k);
      m.compose(p.clone().setY(1.5 * k), q, s);
      trunks.setMatrixAt(i, m);
      m.compose(p.clone().setY(8 * k), q, s);
      leaves.setMatrixAt(i, m);
    }
    scene.add(leaves, trunks);
  }


  /* =====================================================================
     BALL  (fixed 120 Hz physics; no spin or drag, so paths are predictable)
     ===================================================================== */
  const G = 24;
  const BALL_R = 0.2;
  const BOUNCE_V = 0.66;
  const BOUNCE_H = 0.85;
  const STEP = 1 / 120;
  const REACH = 4.0;
  const SWEET = 1.6;

  const netHeightAt = (x) => COURT.netCenter + (COURT.netPost - COURT.netCenter) * Math.pow(Math.min(1, Math.abs(x) / COURT.postX), 2);

  const ball = {
    pos: new THREE.Vector3(), vel: new THREE.Vector3(),
    held: true, live: false, bounces: 0, lastTeam: null, netted: false,
    comet: false,       // this shot is your ultimate
  };

  function stepBall(b, dt) {
    const pz = b.pos.z, py = b.pos.y;
    b.vel.y -= G * dt;
    b.pos.addScaledVector(b.vel, dt);
    if (!b.netted && (pz > 0) !== (b.pos.z > 0) && Math.abs(b.pos.x) < COURT.postX) {
      const f = pz / (pz - b.pos.z);
      const yc = py + (b.pos.y - py) * f;
      if (yc < netHeightAt(b.pos.x) + BALL_R * 0.5) {
        b.netted = true;
        b.pos.z = pz > 0 ? 0.25 : -0.25;
        b.vel.z *= -0.12;
        b.vel.x *= 0.4;
        if (b.vel.y > 0) b.vel.y *= 0.3;
        return 'net';
      }
    }
    // Touching the fence marks the ball: once it has bounced, a fence hit makes it dead.
    if (Math.abs(b.pos.x) > AREA.halfW - 0.3) { b.pos.x = Math.sign(b.pos.x) * (AREA.halfW - 0.3); b.vel.x *= -0.25; b.fenced = true; }
    if (Math.abs(b.pos.z) > AREA.halfL - 0.3) { b.pos.z = Math.sign(b.pos.z) * (AREA.halfL - 0.3); b.vel.z *= -0.25; b.fenced = true; }
    if (b.pos.y < BALL_R) {
      b.pos.y = BALL_R;
      if (b.vel.y < -1.2) {
        b.vel.y = -b.vel.y * BOUNCE_V;
        b.vel.x *= BOUNCE_H;
        b.vel.z *= BOUNCE_H;
        return 'bounce';
      }
      b.vel.y = 0;
      b.vel.x *= 0.985;
      b.vel.z *= 0.985;
      return 'roll';
    }
    return null;
  }

  function predict(maxT = 3.5) {
    const sim = { pos: ball.pos.clone(), vel: ball.vel.clone(), netted: ball.netted };
    const out = [];
    let b = ball.bounces, t = 0;
    const dt = 1 / 120;
    for (let i = 0; t < maxT; i++) {
      t += dt;
      const ev = stepBall(sim, dt);
      if (ev === 'bounce' || ev === 'roll') b++;
      if (i % 2 === 1) out.push({ t, x: sim.pos.x, y: sim.pos.y, z: sim.pos.z, b });
      if (b >= 2) break;
      if (sim.fenced && b >= 1) break;   // dead once it bounces into the fence
    }
    return out;
  }

  /* =====================================================================
     SHOTS
     ===================================================================== */
  const rand = (a, b) => a + Math.random() * (b - a);
  const randn = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function solveShot(P, tx, tz, t, clear) {
    const v = new THREE.Vector3();
    for (let i = 0; i < 40; i++) {
      v.set((tx - P.x) / t, (BALL_R - P.y + 0.5 * G * t * t) / t, (tz - P.z) / t);
      const tn = -P.z / v.z;
      if (tn > 0 && tn < t) {
        const yn = P.y + v.y * tn - 0.5 * G * tn * tn;
        if (yn < netHeightAt(P.x + v.x * tn) + clear) { t *= 1.07; continue; }
      }
      break;
    }
    return v;
  }

  /* =====================================================================
     ULTIMATE LAB
     A practice court: Rex feeds you a ball, you hit it back (with the
     selected ultimate when it's armed), and Rex and Juno try to return it.
     ===================================================================== */
  const store = {

  const ULTS = [

  // Order the list is shown in (and the order of the 1-9, 0, -, = keys).

  const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '='];   // key that picks each ultimate
  let fx_cosmoHit = () => {};
  const UL = Object.fromEntries(ULTS.map((u) => [u.id, u]));

  const lab = Object.assign({ ult: 'comet', auto: true, speed: 1, cam: 'behind', paths: true, sound: true }, store.get('kc-lab', {}));

  const HUMAN_SPEED = 15, RIVAL_SPEED = 14, RIVAL_REACT = 0.28, RIVAL_REACH = 2.8;

  /* ---------------- players ---------------- */
  function makePlayer(id, x, z) {

    scene.add(ch.root);
    return {
      id, d, ch, team: d.team, name: id === 'you' ? 'You' : d.name.charAt(0) + d.name.slice(1).toLowerCase(),
      pos: new THREE.Vector3(x, 0, z), vel: new THREE.Vector3(), yaw: d.team === 'a' ? 0 : Math.PI,

  const rivals = [rex, juno];
  const everyone = [you, rex, juno];

  const STROKE = { swing: { contact: 0.48, end: 1.0 }, backhand: { contact: 0.471, end: 1.0 }, overhead: { contact: 0.752, end: 1.2 } };
  function stroke(p, bx, by) {
    const r = p.team === 'a' ? 1 : -1;
    const mode = by > 5.2 ? 'overhead' : (bx - p.pos.x) * r >= -0.4 ? 'swing' : 'backhand';
    const s = STROKE[mode];
    p.swing = { mode, t: Math.max(0, s.contact - 0.1), end: s.end };
  }
  function animate(p, dt) {
    const s = p.team === 'a' ? 1 : -1;
    const speed = Math.hypot(p.vel.x, p.vel.z);
    let target = s > 0 ? 0 : Math.PI;
    if (!p.swing && speed > 2 && p.vel.z * s < speed * 0.6) target = Math.atan2(-p.vel.x, -p.vel.z);
    let d = target - p.yaw;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    p.yaw += d * (1 - Math.exp(-dt * (p.swing ? 18 : 12)));
    p.ch.root.position.set(p.pos.x, 0, p.pos.z);
    p.ch.root.rotation.y = p.yaw;
    if (p.swing) {
      p.swing.t += dt;
      p.ch.update(p.swing.mode, p.swing.t, dt);
      if (p.swing.t >= p.swing.end) p.swing = null;
      return;
    }
    if (p.frozen > 0) { p.ch.update('idle', 0, dt); return; }
    const running = speed > 1.5;
    p.clock += dt * (running ? Math.min(1.25, Math.max(0.45, speed / 13)) : 1);
    p.ch.update(running ? 'run' : 'idle', p.clock, dt);
  }
  function moveTo(p, tx, tz, maxSpeed, dt) {
    const dx = tx - p.pos.x, dz = tz - p.pos.z, d = Math.hypot(dx, dz);
    const want = d > 0.25 ? Math.min(maxSpeed, d * 4) : 0;
    const vx = d > 0 ? (dx / d) * want : 0, vz = d > 0 ? (dz / d) * want : 0;
    const k = 1 - Math.exp(-dt * 10);
    p.vel.x += (vx - p.vel.x) * k;
    p.vel.z += (vz - p.vel.z) * k;
    p.pos.x += p.vel.x * dt;
    p.pos.z += p.vel.z * dt;
    const s = p.team === 'a' ? 1 : -1;
    p.pos.x = clamp(p.pos.x, -AREA.halfW + 1, AREA.halfW - 1);
    p.pos.z = s * clamp(p.pos.z * s, 0.8, AREA.halfL - 1);
  }
  function slide(p, tx, tz, maxSpeed, dt) {
    const sp = Math.hypot(p.vel.x, p.vel.z);
    if (sp < TIDE.start) { moveTo(p, tx, tz, maxSpeed, dt); return; }
    let a = Math.atan2(p.vel.z, p.vel.x);
    const want = Math.atan2(tz - p.pos.z, tx - p.pos.x);
    let d = Math.atan2(Math.sin(want - a), Math.cos(want - a));
    a += clamp(d, -TIDE.turn * dt, TIDE.turn * dt);
    // Walking against the slide (more than 90 degrees off) brakes it to half
    // the run speed; otherwise the slider can speed up but never slow down.
    const v = Math.abs(d) > Math.PI / 2
      ? Math.max(Math.min(sp, maxSpeed * TIDE.brake), sp - TIDE.decel * dt)
      : Math.max(sp, Math.min(maxSpeed, sp + 6 * dt));
    p.vel.set(Math.cos(a) * v, 0, Math.sin(a) * v);
    const bx = p.pos.x + p.vel.x * dt, bz = p.pos.z + p.vel.z * dt;
    p.pos.x = bx; p.pos.z = bz;
    const s = p.team === 'a' ? 1 : -1;
    p.pos.x = clamp(p.pos.x, -AREA.halfW + 1, AREA.halfW - 1);
    p.pos.z = s * clamp(p.pos.z * s, 0.8, AREA.halfL - 1);
    if (p.pos.x !== bx) p.vel.x = 0;   // bumped the fence or the net: that direction stops
    if (p.pos.z !== bz) p.vel.z = 0;
  }
  const drive = (p, tx, tz, maxSpeed, dt) => (S.tideT > 0 ? slide : moveTo)(p, tx, tz, maxSpeed, dt);
  const horiz = (p, b) => Math.hypot(b.pos.x - p.pos.x, b.pos.z - p.pos.z);
  function say(p, text, time = 1.2) { p.status = text; p.statusT = time; }

  /* ---------------- ball + fakes ---------------- */
  Object.assign(ball, { kind: 'plain', curve: 0, age: 0, frost: false, quake: 0 });
  const fakeBall = () => ({ pos: new THREE.Vector3(), vel: new THREE.Vector3(), netted: false, bounces: 0, age: 0, curve: 0, frost: false, alive: false, fade: 0 });
  const fakes = [fakeBall(), fakeBall()];

  function launch(b, P, v) {
    b.pos.copy(P); b.vel.copy(v);
    b.netted = false; b.fenced = false; b.bounces = 0; b.age = 0; b.curve = 0; b.frost = false; b.quake = 0;
  }
  // One physics step, plus the lab's extras: curve force and the frost bounce.
  function stepB(b) {
    if (b.curve && b.bounces === 0 && b.age > CURVE.after) b.vel.x += b.curve * STEP;
    b.age += STEP;
    const ev = stepBall(b, STEP);
    if (ev === 'bounce') {
      b.bounces++;
      if (b.frost && b.bounces === 1) b.vel.multiplyScalar(FROST.bounce);
      // Earthquake: the crack kicks the ball up high and turns it (quake = turn angle, radians).
      if (b.quake && b.bounces === 1) {
        const c = Math.cos(b.quake), s = Math.sin(b.quake), vx = b.vel.x, vz = b.vel.z;
        b.vel.x = (vx * c - vz * s) * QUAKE.keep;
        b.vel.z = (vx * s + vz * c) * QUAKE.keep;
        b.vel.y *= QUAKE.lift;
        b.quake = 0;
      }
    } else if (ev === 'roll' && b.bounces < 2) b.bounces = 2;
    return ev;
  }
  // Where a ball will go. curve overrides the ball's own bend (0 = the straight line a rival expects).
  // quake = false gives the bounce a rival expects before the crack shows.
  function simulate(src, maxT = 3.2, curve = src.curve, quake = true) {
    const s = { pos: src.pos.clone(), vel: src.vel.clone(), netted: src.netted, bounces: src.bounces, age: src.age, curve, frost: src.frost, quake: quake ? src.quake || 0 : 0 };
    const out = [];
    let t = 0;
    for (let i = 0; t < maxT; i++) {
      t += STEP;
      stepB(s);
      if (i % 2) out.push({ t, x: s.pos.x, y: s.pos.y, z: s.pos.z, b: s.bounces });
      if (s.bounces >= 2) break;
      if (s.fenced && s.bounces >= 1) break;   // dead once it bounces into the fence
    }
    return out;
  }
  const firstBounce = (smp) => smp.find((s) => s.b >= 1) || smp[smp.length - 1];

  /* ---------------- rally state ---------------- */
  const S = {
    phase: 'ready', phaseT: 0, time: 0, ballT: 0, acc: 0,
    armed: false, warpT: 0, windT: 0, glassT: 0, holeT: 0, hole: { x: 0, z: -12 }, gasT: 0, gasOn: null, cosmo: null, tideT: 0, pendingWhy: '', autoWind: -1,
    pending: null,              // a rival return heading for the glass wall
    shot: null,                 // what your last hit was: { kind, speed, land, fakeLand, crossAt, revealAt, revealed }
    result: null, replanT: 0, shake: 0,
  };
  const tally = Object.fromEntries(['plain', ...ULTS.map((u) => u.id)].map((k) => [k, { fired: 0, win: 0, ret: 0 }]));

  function rivalsCenterX() { return (rex.pos.x + juno.pos.x) / 2; }
  function openGap() {
    let best = 0, bestScore = -1;
    for (const x of [-8, -4, 0, 4, 8]) {
      const sc = Math.min(...rivals.map((r) => Math.abs(r.pos.x - x))) + Math.random() * 3;
      if (sc > bestScore) { bestScore = sc; best = x; }
    }
    return best;
  }

  function resetRally() {
    S.phase = 'ready'; S.phaseT = 0; S.result = null; S.shot = null; S.pending = null;
    ball.held = true; ball.live = false; ball.kind = 'plain'; ball.lastTeam = null;
    fakes.forEach((f) => { f.alive = false; });
    rivals.forEach((r) => { r.plan = null; r.fake = null; r.fooled = false; r.frozen = 0; r.delay = 0; r.closest = 99; r.stamina = 1; r.knock = null; });
    you.plan = null;
    if (lab.ult === 'wind' && S.windT <= 0) you.stamina = WIND.tired;
    fx.clearPaths();
  }

  function feed() {
    const wide = lab.ult === 'wind';
    const tx = wide ? (you.pos.x > 0 ? -1 : 1) * rand(6.5, 8.5) : rand(-5, 5);
    const tz = rand(15, 18.5);
    const P = new THREE.Vector3(rex.pos.x - 1.1, 2.5, rex.pos.z + 1.2);
    launch(ball, P, solveShot(P, tx, tz, 1.65, 1.5));
    ball.held = false; ball.live = true; ball.kind = 'plain'; ball.lastTeam = 'b';
    stroke(rex, P.x, P.y);
    sfx.hit('plain', 0.6);
    S.phase = 'feed'; S.phaseT = 0; S.ballT = 0;
    planYou();
    if (lab.auto) {
      const u = UL[lab.ult];
      if (u.kind === 'Shot') arm(true);
      if (u.id === 'wind' && S.windT <= 0) S.autoWind = 0.45;
      if (u.id === 'warp' && S.warpT <= 0) S.autoWind = 0.8;   // starts just before you hit
    }
  }

  /* ---------------- you ---------------- */
  const youSpeed = () => HUMAN_SPEED * speedMult(you.stamina) * (S.windT > 0 ? WIND.boost : 1);
  function planYou() {
    // Take the feed out of the air as it drops through 3 to 5 ft (a high contact
    // lets fast shots clear the net), or after the bounce if that is too far.
    let pick = null, prevY = 99;
    for (const s of simulate(ball, 3.5)) {
      const down = s.y < prevY; prevY = s.y;
      const air = s.b === 0 && down && s.y <= 5.2 && s.y >= 3 && s.z > 7;
      const low = s.b === 1 && s.y <= 3.8 && s.y >= 1.3 && s.z > 3;
      if (!air && !low) continue;
      const x = s.x - SWEET, z = s.z + 0.4;
      pick = { x, z };
      if (Math.hypot(x - you.pos.x, z - you.pos.z) / youSpeed() <= s.t) break;
    }
    you.plan = pick;
  }
  const canTake = () => ball.pos.z > 3 && (
    (ball.bounces === 0 && ball.vel.y < 0 && ball.pos.y <= 5.3 && ball.pos.y >= 2.8 && ball.pos.z > 6) ||
    (ball.bounces === 1 && ball.pos.y <= 4.6 && ball.pos.y >= 1.2));
  function tire(p, dt) {
    const speed = Math.hypot(p.vel.x, p.vel.z);
    if (speed > 1) { p.still = 0; p.stamina = Math.max(0, p.stamina - FATIGUE.drain * (speed / HUMAN_SPEED) * dt); }
    else { p.still += dt; if (p.still > FATIGUE.still) p.stamina = Math.min(1, p.stamina + FATIGUE.refill * dt); }
  }
  function updateYou(dt) {
    if (S.phase === 'feed' && you.plan) moveTo(you, you.plan.x, you.plan.z, youSpeed(), dt);
    else moveTo(you, you.home.x, you.home.z, Math.min(youSpeed(), 9), dt);
    if (S.windT > 0) { /* boost keeps you fresh */ } else tire(you, dt);
  }

  // Your hit. Uses the armed ultimate if there is one.
  function yourHit() {
    if (lab.auto && lab.ult === 'glass' && S.glassT <= 0) arm(true);
    if (lab.auto && lab.ult === 'hole' && S.holeT <= 0) arm(true);
    if (lab.auto && lab.ult === 'gas' && S.gasT <= 0) arm(true);
    if (lab.auto && lab.ult === 'cosmo' && !S.cosmo) arm(true);
    if (lab.auto && lab.ult === 'tide' && S.tideT <= 0) arm(true);   // up before their return
    S.pending = null;
    let kind = 'plain';
    if (S.armed) { kind = lab.ult; S.armed = false; }
    else if (S.warpT > 0) kind = 'warp';
    else if (S.windT > 0) kind = 'wind';
    else if (S.glassT > 0) kind = 'glass';
    else if (S.holeT > 0) kind = 'hole';
    else if (S.gasT > 0) kind = 'gas';
    else if (S.cosmo) kind = 'cosmo';
    else if (S.tideT > 0) kind = 'tide';
    const P = ball.pos.clone();
    const shot = { kind, crossAt: null, revealAt: null, revealed: false, fakeLand: null };
    let v;
    if (kind === 'comet') {
      const tx = openGap() * 0.9, tz = -rand(12, 18);
      v = solveShot(P, tx, tz, Math.hypot(tx - P.x, tz - P.z) / 75, 0.25);
      S.shake = 0.6;
    } else if (kind === 'curve') {
      const side = rivalsCenterX() > 0 ? -1 : 1;
      const tx = side * rand(5, 8), tz = -rand(13, 18);
      v = solveShot(P, tx, tz, Math.hypot(tx - P.x, tz - P.z) / 45, 0.45);
      // x is linear in the starting sideways speed, so work out the bend
      // alone, then aim so the bent path lands on target.
      let y = P.y, vy = v.y, x = 0, vx = 0, age = 0, n = 0;
      while (y >= BALL_R && n < 1200) {
        if (age > CURVE.after) vx += side * CURVE.accel * STEP;
        age += STEP; vy -= G * STEP; y += vy * STEP; x += vx * STEP; n++;
      }
      v.x = (tx - P.x - x) / (n * STEP);
      launch(ball, P, v);
      ball.curve = side * CURVE.accel;
      shot.fakeLand = firstBounce(simulate(ball, 3, 0));
    } else if (kind === 'frost') {
      const near = rivals.reduce((a, r) => (Math.abs(r.pos.z) < Math.abs(a.pos.z) ? r : a));
      const tx = clamp(near.pos.x + rand(-2.5, 2.5), -8, 8), tz = -rand(3, 5);
      v = solveShot(P, tx, tz, 1.15, 0.5);
      const victim = rivals.reduce((a, r) => (Math.hypot(r.pos.x - tx, r.pos.z - tz) < Math.hypot(a.pos.x - tx, a.pos.z - tz) ? r : a));
      victim.frozen = FROST.freeze;
      rivals.forEach((r) => { r.stamina = Math.max(0, r.stamina - FROST.tire); });   // the cold tires both rivals
      say(victim, 'FROZEN', FROST.freeze);
      shot.victim = victim;
      sfx.frost();
    } else if (kind === 'quake') {
      const tx = rand(-4, 4), tz = -rand(11, 15);
      v = solveShot(P, tx, tz, Math.hypot(tx - P.x, tz - P.z) / 35, 0.4);
      S.shake = 0.5;
      sfx.rumble();
    } else if (kind === 'mirage') {
      const xs = [-8, 0, 8].map((x) => x + rand(-1, 1)).sort(() => Math.random() - 0.5);
      const t = (x, z) => Math.hypot(x - P.x, z - P.z) / 50;
      const tz = -rand(13, 18);
      v = solveShot(P, xs[0], tz, t(xs[0], tz), 0.4);
      fakes.forEach((f, i) => {
        const fz = -rand(13, 18);
        launch(f, P, solveShot(P, xs[i + 1], fz, t(xs[i + 1], fz), 0.4));
        f.alive = true; f.fade = 1;
      });
      sfx.shimmer();
    } else {
      const tx = openGap() * 0.85, tz = -rand(13, 19);
      v = solveShot(P, tx, tz, Math.hypot(tx - P.x, tz - P.z) / 43, 0.35);
    }
    if (kind !== 'curve') launch(ball, P, v);
    ball.kind = kind; ball.lastTeam = 'a';
    ball.frost = kind === 'frost';
    if (kind === 'quake') {
      // Turn toward the side with more open court.
      const side = ball.pos.x + ball.vel.x * 0.6 > 0 ? -1 : 1;
      ball.quake = side * THREE.MathUtils.degToRad(rand(QUAKE.turn[0], QUAKE.turn[1]));
    }
    shot.speed = ball.vel.length();
    const smp = simulate(ball, 3.2);
    if (kind === 'quake') fx.crack(firstBounce(smp));
    shot.land = firstBounce(smp);
    if (kind === 'mirage') shot.revealAt = Math.max(0.2, shot.land.t - 0.15);
    S.shot = shot;
    S.phase = 'out'; S.phaseT = 0; S.ballT = 0; S.replanT = 0;
    tally[kind].fired++;
    hud.tally();
    stroke(you, P.x, P.y);
    sfx.hit(kind, 1);

    // Rivals react.
    rivals.forEach((r) => {
      r.delay = RIVAL_REACT + (kind === 'comet' ? COMET.delay : 0);
      if (kind === 'comet') say(r, 'LATE', r.delay);
      // Earthquake: the shaking ground keeps rivals off balance until the ball lands.
      if (kind === 'quake') { r.delay = Math.max(r.delay, shot.land.t); say(r, 'SHAKING', shot.land.t); }
      r.closest = 99; r.fooled = false; r.plan = null;
      r.fake = kind === 'mirage' ? [ball, ...fakes][Math.floor(Math.random() * 3)] : null;
    });
    replanRivals(true);
    fx.drawPaths(kind, smp, shot);
    hud.lastShot(shot);
  }

  function arm(auto) {
    const u = UL[lab.ult];
    const wasArmed = S.armed;
    if (u.kind === 'Shot') {
      if (S.armed && !auto) return;
      if (!S.armed) { S.armed = true; sfx.arm(); }
    } else if (u.id === 'warp') {
      if (S.warpT > 0) return;
      S.warpT = WARP.time; sfx.warp();
    } else if (u.id === 'wind') {
      if (S.windT > 0) return;
      S.windT = WIND.time; you.stamina = 1; sfx.wind();
    } else if (u.id === 'glass') {
      if (S.glassT > 0) return;
      S.glassT = GLASS.time; sfx.glass();
    } else if (u.id === 'tide') {
      if (S.tideT > 0) return;
      S.tideT = TIDE.time;
      sfx.tide();
    } else if (u.id === 'cosmo') {
      if (S.cosmo) return;
      // The ring flies from you toward the rivals; each one is knocked back as it reaches them.
      const near = rivals.reduce((a, r) => (Math.hypot(r.pos.x - you.pos.x, r.pos.z - you.pos.z) < Math.hypot(a.pos.x - you.pos.x, a.pos.z - you.pos.z) ? r : a));
      S.cosmo = { t: 0, x0: you.pos.x, z0: you.pos.z - 1, z: you.pos.z - 1, near, hit: new Set() };
      S.shake = 0.3;
      sfx.cosmo();
    } else if (u.id === 'gas') {
      if (S.gasT > 0) return;
      S.gasT = GAS.time;
      rivals.forEach((r) => say(r, 'POISONED', GAS.time));
      sfx.gas();
    } else if (u.id === 'hole') {
      if (S.holeT > 0) return;
      S.holeT = HOLE.time;
      S.hole.x = rand(-HOLE.x, HOLE.x);   // a random spot near the rival baseline
      S.hole.z = -rand(HOLE.z[0], HOLE.z[1]);
      say(rex, 'BOTH PULLED IN', HOLE.time);
      sfx.hole();
    }
    // Whoever uses an ultimate calls out its name.
    if (!(u.kind === 'Shot' && wasArmed)) callOut(you, u.name);
    hud.fire();
  }
  function callOut(p, name) {
    say(p, name.toUpperCase() + '!', 1.5);
    sfx.speak(name + '!');
  }

  /* ---------------- rivals ---------------- */
  function rivalPlan(r, src, curve) {
    let pick = null, slack = -1e9;
    const hideQuake = ball.kind === 'quake' && S.shot && !S.shot.revealed;
    for (const s of simulate(src, 3.2, curve, !hideQuake)) {
      if (s.b >= 2) break;
      if (s.z > -0.6 || s.y > 6.2 || s.y < 0.9) continue;
      if (s.b === 0 && Math.abs(s.z) < COURT.kitchen) continue;   // no volleys in the kitchen
      const x = s.x + SWEET, z = s.z - 0.4;
      const need = Math.max(r.delay, 0) + Math.max(r.frozen, 0) + (r.knock ? Math.max(0, COSMO.knock - r.knock.t) : 0) + Math.hypot(x - r.pos.x, z - r.pos.z) / (RIVAL_SPEED * speedMult(r.stamina));
      const sl = s.t - need;
      if (sl > slack || !pick) { slack = sl; pick = { x, z, slack: sl }; }
      if (sl >= 0) break;
    }
    return pick;
  }
  function replanRivals(first) {
    const k = ball.kind, sh = S.shot;
    rivals.forEach((r) => {
      let src = ball, curve = ball.curve;
      if (k === 'curve' && !sh.revealed) {
        if (!first) return;          // keep chasing the straight line until the bend is read
        curve = 0;
      }
      if (k === 'mirage' && !sh.revealed) { src = r.fake; curve = 0; }
      r.plan = rivalPlan(r, src, curve);
    });
    if (k !== 'mirage') {
      // Doubles: whoever can get there sooner takes it; the other covers.
      const ok = rivals.filter((r) => r.plan && r.frozen <= 0);
      const pool = ok.length ? ok : rivals.filter((r) => r.plan);
      if (pool.length === 2) {
        const [a, b] = pool;
        const loser = a.plan.slack >= b.plan.slack ? b : a;
        if (!(k === 'curve' && !sh.revealed && !first)) loser.plan = null;
      }
    }
  }
  function updateRival(r, dt) {
    if (r.knock) {
      // Cosmo knockback: slide fast to the spot, easing out.
      const k = r.knock;
      k.t += dt;
      const e = 1 - Math.pow(1 - Math.min(1, k.t / COSMO.knock), 3);
      r.pos.x = k.fx + (k.tx - k.fx) * e;
      r.pos.z = k.fz + (k.tz - k.fz) * e;
      r.vel.set(0, 0, 0);
      if (k.t >= COSMO.knock) r.knock = null;
      if (r.statusT > 0) { r.statusT -= dt; if (r.statusT <= 0) r.status = ''; }
      return;
    }
    if (r.delay > 0) r.delay -= dt;
    if (r.frozen > 0) { r.frozen -= dt; r.vel.set(0, 0, 0); }
    else if (r.delay > 0) {
      if (S.tideT > 0 && Math.hypot(r.vel.x, r.vel.z) >= TIDE.start) slide(r, r.pos.x + r.vel.x, r.pos.z + r.vel.z, RIVAL_SPEED, dt);
      else r.vel.multiplyScalar(Math.exp(-dt * 8));
    }
    else if (S.phase === 'out' && !S.result && r.plan) drive(r, r.plan.x, r.plan.z, RIVAL_SPEED * speedMult(r.stamina), dt);
    else drive(r, r.home.x, r.home.z, RIVAL_SPEED * 0.6 * speedMult(r.stamina), dt);
    if (S.tideT > 0 && Math.hypot(r.vel.x, r.vel.z) >= TIDE.start && r.status !== 'SLIDING') say(r, 'SLIDING', 0.5);
    else if (S.tideT > 0 && r.status === 'SLIDING') r.statusT = Math.max(r.statusT, 0.1);
    if (S.holeT > 0) {
      // Black Hole: rivals still run where they want, but the hole drags them
      // toward the hole the whole time, so running away from it is slow.
      const side = r === rex ? -1 : 1;
      const dx = S.hole.x + side * HOLE.spread - r.pos.x, dz = S.hole.z - r.pos.z, d = Math.hypot(dx, dz);
      if (d > 0.3) {
        r.pos.x += (dx / d) * Math.min(d, HOLE.pull * dt);
        r.pos.z = Math.min(-0.8, r.pos.z + (dz / d) * Math.min(d, HOLE.pull * dt));
      }
    }
    if (r.statusT > 0) { r.statusT -= dt; if (r.statusT <= 0) r.status = ''; }
  }
  function rivalReturn(r) {
    const P = ball.pos.clone();
    // Poison: a gassed rival often mis-hits, long or wide.
    const sick = S.gasT > 0 && Math.random() < GAS.mishit;
    if (sick) {
      const long = Math.random() < 0.5;
      const tx = long ? rand(-6, 6) : (Math.random() < 0.5 ? -1 : 1) * rand(12.5, 15);
      const tz = long ? rand(24.5, 28) : rand(10, 18);
      launch(ball, P, solveShot(P, tx, tz, 1.3, 1.0));
      say(r, 'MIS-HIT!', 1);
    } else launch(ball, P, solveShot(P, rand(-6, 6), rand(9, 16), 1.25, 1.0));
    ball.kind = 'plain'; ball.lastTeam = 'b';
    stroke(r, P.x, P.y);
    sfx.hit('plain', 0.7);
    fakes.forEach((f) => { f.alive = false; });
    rivals.forEach((q) => { q.plan = null; });
    // With the glass up, wait to see whether the wall sends it back.
    if (S.glassT > 0 || sick) { S.pending = r; S.pendingWhy = sick ? 'gas' : 'glass'; return; }
