  }

  /* ---------------- results ---------------- */
  function finish(kind, big, small) {
    if (S.result) return;
    S.result = kind;
    S.phase = 'after'; S.phaseT = 0;
    const t = tally[S.shot ? S.shot.kind : 'plain'];
    if (kind === 'win') t.win++;
    if (kind === 'ret') t.ret++;
    hud.result(kind, big, small);
    hud.tally();
    if (kind === 'win') sfx.win(); else sfx.miss();
  }
  function winnerNote() {
    const sh = S.shot;
    const fooled = rivals.filter((r) => r.fooled);
    if (sh.kind === 'mirage' && fooled.length) return `${fooled.map((r) => r.name).join(' and ')} swung at a fake`;
    if (sh.kind === 'cosmo') return 'Knocked back, they could not recover in time';
    if (sh.kind === 'frost' && sh.victim) return `${sh.victim.name} was frozen for ${FROST.freeze} s and could not reach it`;
    const c = rivals.reduce((a, r) => (r.closest < a.closest ? r : a));
    if (c.closest > 8) return 'Nobody got close';
    return `${c.name} missed it by ${c.closest.toFixed(1)} ft`;
  }
  function onBallEvent(ev) {
    if (ev === 'bounce' || ev === 'roll') fx.bounce(ball.pos);
    if (ev === 'bounce' && ball.bounces === 1) sfx.bounce();
    if (S.phase === 'feed') {
      if (ball.bounces >= 2) { S.shot = null; finish('miss', 'Missed the feed', 'Too tired to reach it'); }
      return;
    }
    if (S.phase !== 'out' || S.result) return;
    if (S.pending) {
      if (ev === 'net') finish('win', 'Into the net', `${S.pending.name}'s return hit the net`);
      else if (ev === 'bounce' && ball.pos.z > 0) {
        const wide = Math.abs(ball.pos.x) - COURT.halfW, long = ball.pos.z - COURT.halfL;
        if (wide > 0.05 || long > 0.05) finish('win', 'Mis-hit!', `${S.pending.name} hit it ${long > wide ? 'long' : 'wide'} in the gas`);
        else finish('ret', 'Returned', S.pendingWhy === 'glass' ? `${S.pending.name} got it past the Firewall as it dropped` : `${S.pending.name} got it back`);
      }
      return;
    }
    if (ev === 'net') { finish('lose', 'Into the net', 'The shot did not clear'); return; }
    if (ev === 'bounce' && ball.bounces === 1) {
      const wide = Math.abs(ball.pos.x) - COURT.halfW, long = -ball.pos.z - COURT.halfL;
      if (wide > 0.05 || long > 0.05 || ball.pos.z > 0) {
        finish('lose', 'Out', `Landed ${Math.max(wide, long).toFixed(1)} ft ${wide > long ? 'wide' : 'long'}`);
        return;
      }
      if (ball.frost) fx.frostBurst(ball.pos);
      if (ball.kind === 'quake' && !S.shot.revealed) {
        S.shot.revealed = true;
        S.shake = 0.4;
        fx.quakeBurst(ball.pos);
        sfx.crack();
        rivals.forEach((r) => { r.delay = Math.max(r.delay, 0.15); say(r, 'WHOA', 0.8); });
        replanRivals();
      }
    }
    if (ball.bounces >= 2) finish('win', 'Winner!', winnerNote());
  }

  /* ---------------- update ---------------- */
  function update(dt) {
    S.time += dt;
    S.phaseT += dt;
    if (S.warpT > 0) S.warpT = Math.max(0, S.warpT - dt);
    if (S.windT > 0) S.windT = Math.max(0, S.windT - dt);
    if (S.glassT > 0) S.glassT = Math.max(0, S.glassT - dt);
    if (S.gasT > 0) S.gasT = Math.max(0, S.gasT - dt);
    if (S.tideT > 0) S.tideT = Math.max(0, S.tideT - dt);
    if (S.cosmo) {
      const c = S.cosmo;
      c.t += dt;
      if (c.t < COSMO.windup) {
        // Spins up around you first, then flies off flat like a frisbee.
        c.x0 = you.pos.x; c.z0 = you.pos.z; c.z = c.z0;
      } else c.z = c.z0 - COSMO.speed * (c.t - COSMO.windup);
      rivals.forEach((r) => {
        if (c.hit.has(r) || c.z > r.pos.z) return;
        c.hit.add(r);
        const fx = r.pos.x, fz = r.pos.z;
        let tx = fx, tz = fz;
        if (r === c.near) tz = -COURT.halfL;                                        // all the way back to the baseline
        else tx = (Math.abs(fx) > 0.3 ? Math.sign(fx) : (r === rex ? -1 : 1)) * COURT.halfW;   // out to the sideline
        r.knock = { fx, fz, tx, tz, t: 0 };
        r.stamina = Math.max(0, r.stamina - COSMO.fatigue);   // each rival loses 25% of their fatigue bar
        say(r, 'KNOCKED BACK', 1.2);
        fx_cosmoHit(r);
      });
      if (c.z < -AREA.halfL) S.cosmo = null;
    }
    if (S.holeT > 0) { S.holeT = Math.max(0, S.holeT - dt); if (!S.holeT) rivals.forEach((r) => { if (r.status === 'PULLED') say(r, '', 0); }); }
    if (S.autoWind > 0) { S.autoWind -= dt; if (S.autoWind <= 0) arm(true); }
    const bF = S.warpT > 0 ? WARP.ball : 1, rF = S.warpT > 0 ? WARP.rivals : 1;

    updateYou(dt);
    rivals.forEach((r) => updateRival(r, dt * rF));

    if (S.phase === 'ready') {
      const home = everyone.every((p) => Math.hypot(p.pos.x - p.home.x, p.pos.z - p.home.z) < 1);
      if (S.phaseT > 0.9 && (home || S.phaseT > 2.4)) feed();
    } else {
      S.acc += dt * bF;
      while (S.acc >= STEP) {
        S.acc -= STEP;
        S.ballT += STEP;
        const crossed = ball.pos.z;
        const ev = stepB(ball);
        if (ev) onBallEvent(ev);
        // A ball that bounces and then hits the fence is dead: nobody may play it.
        if (ball.fenced && ball.bounces >= 1 && !S.result) {
          if (S.phase === 'feed') { S.shot = null; finish('miss', 'Missed the feed', 'It bounced into the fence'); }
          else if (S.phase === 'out' && !S.pending) finish('win', 'Winner!', 'It bounced into the fence');
          else if (S.phase === 'out' && S.pending) finish('ret', 'Returned', `${S.pending.name}'s return bounced into the fence`);
        }
        fakes.forEach((f) => { if (f.alive) stepB(f); });
        if (S.phase === 'feed' && canTake() && horiz(you, ball) < 2.6) yourHit();
        if (S.phase === 'out' && !S.result && S.pending) {
          // Glass Wall: a ball crossing toward you bounces straight back.
          if (S.glassT > 0 && crossed < GLASS.z && ball.pos.z >= GLASS.z && Math.abs(ball.pos.x) < GLASS.halfW + BALL_R && ball.pos.y < GLASS.h) {
            ball.pos.z = GLASS.z - 0.01;
            ball.vel.z = -Math.abs(ball.vel.z) * 0.75;
            ball.vel.x *= 0.85;
            fx.glassHit(ball.pos);
            sfx.glassHit();
            S.shake = 0.25;
            finish('win', 'Blocked!', `The Firewall sent ${S.pending.name}'s return back`);
          }
        } else if (S.phase === 'out' && !S.result) {
          const sh = S.shot;
          if (sh.crossAt == null && crossed >= 0 && ball.pos.z < 0) sh.crossAt = S.ballT;
          if (!sh.revealed && ball.kind === 'curve' && sh.crossAt != null && S.ballT > sh.crossAt + 0.2) {
            sh.revealed = true; replanRivals(); rivals.forEach((r) => say(r, 'READ IT', 0.8));
          }
          if (!sh.revealed && ball.kind === 'mirage' && S.ballT >= sh.revealAt) {
            sh.revealed = true;
            fakes.forEach((f) => { if (f.alive) fx.poof(f.pos); f.alive = false; });
            sfx.fake();
            replanRivals();
          }
          if (ball.kind !== 'curve' && ball.kind !== 'mirage' || sh.revealed) {
            S.replanT -= STEP;
            if (S.replanT <= 0) { S.replanT = 0.15; replanRivals(); }
          }
          for (const r of rivals) {
            if (ball.pos.z < 0 && ball.pos.y < 6) r.closest = Math.min(r.closest, Math.max(0, horiz(r, ball) - RIVAL_REACH + 1.6));
            const legal = ball.pos.z < -0.3 && ball.pos.y < 6 && ball.pos.y > 0.9 && ball.bounces <= 1 && !(ball.bounces === 0 && Math.abs(ball.pos.z) < COURT.kitchen);
            if (r.frozen <= 0 && r.delay <= 0 && legal && horiz(r, ball) < RIVAL_REACH) { rivalReturn(r); break; }
            if (!r.fooled && r.frozen <= 0 && !sh.revealed && ball.kind === 'mirage' && r.fake !== ball && r.fake.alive &&
                r.fake.pos.y < 6 && horiz(r, r.fake) < RIVAL_REACH - 0.6) {
              r.fooled = true; r.delay = 0.35; stroke(r, r.fake.pos.x, r.fake.pos.y); say(r, 'FAKE!', 1); sfx.fake();
            }
          }
        }
      }
      if (S.phase === 'feed' && S.phaseT > 0.2 && Math.floor(S.phaseT * 5) !== Math.floor((S.phaseT - dt) * 5)) planYou();
      if (S.phase === 'after' && S.phaseT > 1.9) resetRally();
      if (S.phase === 'out' && S.phaseT > 6) finish('win', 'Winner!', winnerNote());
    }
    everyone.forEach((p) => animate(p, p.team === 'b' ? dt * rF : dt));
    if (you.statusT > 0) { you.statusT -= dt; if (you.statusT <= 0) you.status = ''; }
    crowd.update(S.time, S.result === 'win' && S.phaseT < 1.5 ? 1 : 0);
  }

  /* ---------------- sound ---------------- */
  const sfx = (() => {

      o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
      const g = ctx.createGain(); env(g, t, gain, attack, dur);
      o.connect(g).connect(ctx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    }
    return {
      hit(kind, v) {
        if (!ok()) return;
        const t = ctx.currentTime;
        noise(t, 0.06, 0.55 * v, 1900, 1.3);
        tone(t, 640, 380, 0.07, 0.22 * v, 'triangle');
        if (kind === 'comet') {
          tone(t, 120, 40, 0.5, 0.6, 'sine');
          noise(t + 0.02, 0.7, 0.35, 700, 0.7, 'lowpass', 0.05).frequency.exponentialRampToValueAtTime(3500, t + 0.6);
        } else if (kind === 'curve') {
          tone(t + 0.05, 300, 900, 0.5, 0.12, 'sawtooth', 0.08);
          tone(t + 0.05, 305, 880, 0.5, 0.08, 'triangle', 0.08);
        } else if (kind === 'mirage') {

      bounce() { if (ok()) noise(ctx.currentTime, 0.04, 0.25, 900, 1); },
      arm() {
        if (!ok()) return;

      warp() {

      wind() {

      frost() {

      },
      tide() {
        if (!ok()) return;

        [0.3, 0.45, 0.62, 0.8].forEach((d, i) => tone(t + d, 500 + i * 120, 900 + i * 160, 0.08, 0.09, 'sine', 0.005));
      },
      splash() {

      cosmo() {
        if (!ok()) return;

      },

        for (let i = 0; i < 8; i++) noise(t + 0.2 + Math.random() * 0.9, 0.03, 0.18, 3000 + Math.random() * 2000, 2);
      },
      glassHit() {
        if (!ok()) return;

        tone(t, 120, 50, 0.3, 0.3, 'sine');
        for (let i = 0; i < 6; i++) noise(t + Math.random() * 0.4, 0.03, 0.22, 3500 + Math.random() * 2500, 2);

        noise(t + 0.02, 0.5, 0.5, 220, 0.8, 'lowpass');

      },
      shimmer() {},

        tone(t, 900, 300, 0.15, 0.08, 'square');
      },
      win() {
        if (!ok()) return;
        const t = ctx.currentTime;
        [523, 659, 784].forEach((f, i) => tone(t + i * 0.08, f, f, 0.25, 0.08, 'triangle'));
      },

        if (!ok()) return;

      },
    };
  })();

  /* ---------------- effects ---------------- */
  const fx = (() => {

    const ballGeo = new THREE.SphereGeometry(BALL_R, 20, 14);

    function ballVis(n) {

    else if (e.code === 'KeyS') { lab.speed = SPEEDS[(SPEEDS.indexOf(lab.speed) + 1) % SPEEDS.length]; saveLab(); syncSpeed(); }
  });

  /* ---------------- loop ---------------- */
  function render(dt) {
    const w = window.innerWidth, h = window.innerHeight;
    if (w && h && (Math.abs(camera.aspect - w / h) > 0.001)) resize();
    viewOffset(w, h);
    cameraGoal();
    if (camSnap) { camPos.copy(wantPos); camLook.copy(wantLook); camSnap = false; }
    const k = 1 - Math.exp(-dt * 4);
    camPos.lerp(wantPos, k);
    camLook.lerp(wantLook, k);
    camera.position.copy(camPos);
    if (S.shake > 0) {
      S.shake = Math.max(0, S.shake - dt);
      const s = S.shake * 0.6;
      camera.position.x += (Math.random() - 0.5) * s;
      camera.position.y += (Math.random() - 0.5) * s;
    }
    camera.lookAt(camLook);
    fx.update(dt * lab.speed, S.time);
    hud.frame(dt);
    renderer.render(scene, camera);
  }

  resize();
  resetRally();
  everyone.forEach((p) => animate(p, 0.016));
  hud.select();

  let last = performance.now();
  function frame(now) {
    const raw = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    update(raw * lab.speed);
    render(raw);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.__lab = { lab, S, tally, ball, fakes, you, rex, juno, update, render, select, arm, simulate };
})();
</script>
